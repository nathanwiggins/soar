<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Soar Project Hub</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Custom scrollbar for the Kanban board */
    .kanban-scroll::-webkit-scrollbar { height: 8px; }
    .kanban-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .kanban-scroll::-webkit-scrollbar-track { background: transparent; }
    .soar-logo {
      display: block;
      width: 100%;
      max-width: 150px;
      height: auto;
    }
  </style>
</head>

      </div>
      
      <nav class="flex-1 px-4 py-6 space-y-2">
        <a href="#" class="flex items-center px-4 py-3 bg-[#DB0000]/10 text-[#DB0000] rounded-lg font-medium">
          <i class="fa-solid fa-layer-group w-6"></i> Project Board
        </a>
        <a href="#" :class="isDarkMode ? 'text-gray-300 hover:bg-gray-800' : 'text-gray-600 hover:bg-gray-50'" class="flex items-center px-4 py-3 rounded-lg transition-colors">
          <i class="fa-solid fa-calendar w-6"></i> Calendar
        </a>
        <a href="#" :class="isDarkMode ? 'text-gray-300 hover:bg-gray-800' : 'text-gray-600 hover:bg-gray-50'" class="flex items-center px-4 py-3 rounded-lg transition-colors">
          <i class="fa-solid fa-chart-gantt w-6"></i> Timeline
        </a>
      </nav>

      <div :class="isDarkMode ? 'border-gray-700' : 'border-gray-100'" class="p-4 border-t">
        <div class="relative" @click.stop>
          <button @click="toggleUserMenu" class="w-full flex items-center space-x-3 text-left">
            <div class="w-10 h-10 rounded-full bg-[#DB0000]/10 flex items-center justify-center text-[#DB0000] font-bold">
              {{ getInitials(currentUser?.Name) || 'U' }}
            </div>
            <div>
              <p class="text-sm font-medium">{{ currentUser?.Name || 'Loading...' }}</p>
              <p :class="isDarkMode ? 'text-gray-400' : 'text-gray-500'" class="text-xs truncate w-32">{{ currentUser?.Email }}</p>
            </div>
            <i class="fa-solid fa-chevron-up ml-auto text-xs" :class="isDarkMode ? 'text-gray-400' : 'text-gray-500'"></i>
          </button>

          <div v-if="isUserMenuOpen" :class="isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'" class="absolute bottom-14 left-0 w-full rounded-lg border shadow-lg p-2 z-30">
            <button
              @click="toggleDarkMode"
              :class="isDarkMode ? 'hover:bg-gray-700 text-gray-100' : 'hover:bg-gray-100 text-gray-700'"
              class="w-full flex items-center justify-between px-3 py-2 rounded-md text-sm"
            >
              <span><i class="fa-solid fa-moon mr-2"></i> Dark Mode</span>
              <span class="text-xs font-semibold">{{ isDarkMode ? 'On' : 'Off' }}</span>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden">
      <header :class="isDarkMode ? 'bg-gray-900 border-gray-700' : 'bg-white border-gray-200'" class="h-16 border-b flex items-center justify-between px-8">
        <h2 :class="isDarkMode ? 'text-gray-100' : 'text-black'" class="text-xl font-semibold">Project Board</h2>
        <button class="bg-[#DB0000] hover:bg-[#C41425] text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">
          <i class="fa-solid fa-plus mr-1"></i> New Project
        </button>
      </header>

      <div v-if="loading" class="flex-1 flex items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#DB0000]"></div>
      </div>

      <div v-else :class="isDarkMode ? 'bg-gray-950' : 'bg-gray-50/50'" class="flex-1 overflow-x-auto kanban-scroll p-8 transition-colors duration-200">
        <div class="flex space-x-6 h-full items-start">
          
          <div v-for="project in projects" :key="project.Project_ID" class="w-80 flex-shrink-0 flex flex-col max-h-full">
            <div class="flex items-center justify-between mb-4 px-1">
              <h3 :class="isDarkMode ? 'text-gray-200' : 'text-gray-700'" class="font-bold text-sm uppercase tracking-wide flex items-center">
                <span class="w-2 h-2 rounded-full bg-[#DB0000] mr-2"></span>
                {{ project.Project_Title }}
              </h3>
              <span :class="isDarkMode ? 'text-gray-500' : 'text-gray-400'" class="text-xs font-medium">{{ getTasksForProject(project.Project_ID).length }}</span>
            </div>
            
            <div class="flex-1 overflow-y-auto space-y-3 pb-4">
              <div v-for="task in getTasksForProject(project.Project_ID)" :key="task.Task_ID" 
                   :class="isDarkMode ? 'bg-gray-900 border-gray-700 hover:shadow-gray-900' : 'bg-white border-gray-100'" class="p-4 rounded-xl shadow-sm border hover:shadow-md transition-shadow cursor-pointer group"
                   @click="openTaskInfo(task)">
                
                <div class="flex justify-between items-start mb-2">
                  <span :class="statusColor(task.Status)" class="text-[10px] font-bold px-2 py-1 rounded-full uppercase tracking-wider">
                    {{ task.Status }}
                  </span>
                  <i class="fa-regular fa-comments text-gray-300 group-hover:text-[#C41425] transition-colors"></i>
                </div>
                
                <h4 :class="isDarkMode ? 'text-gray-100' : 'text-gray-800'" class="text-sm font-medium mb-2">{{ task.Task_Title }}</h4>
                
                <div class="flex items-center justify-between mt-4">
                  <div class="flex -space-x-2">
                    <div v-for="assignee in getAssigneesForTask(task.Task_ID)" :key="assignee.User_ID"
                         :class="isDarkMode ? 'bg-gray-700 border-gray-900 text-gray-200' : 'bg-gray-200 border-white text-gray-600'"
                         class="w-6 h-6 rounded-full border-2 flex items-center justify-center text-[8px] font-bold"
                         :title="assignee.Name">
                      {{ getInitials(assignee.Name) }}
                    </div>
                  </div>
                  <span v-if="task.Due_Date" :class="isDarkMode ? 'text-gray-400' : 'text-gray-500'" class="text-xs font-medium">
                    <i class="fa-regular fa-clock mr-1"></i> {{ formatDate(task.Due_Date) }}
                  </span>
                </div>
              </div>
              
              <button :class="isDarkMode ? 'border-gray-700 text-gray-500 hover:border-[#C41425] hover:text-[#DB0000]' : 'border-gray-200 text-gray-400 hover:border-[#C41425] hover:text-[#DB0000]'" class="w-full py-2 border-2 border-dashed rounded-xl transition-colors text-sm font-medium">
                + Add Task
              </button>
            </div>
          </div>

        </div>
      </div>
    </main>

  </div>

  <?!= include('App.js'); ?>
</body>
</html>
