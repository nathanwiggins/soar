<script>
  const { createApp, ref, computed, onMounted } = Vue;

  createApp({
    setup() {
      const loading = ref(true);
      const currentUserEmail = ref('');
      const showCreateAccountModal = ref(false);
      const creatingAccount = ref(false);
      const createAccountForm = ref({
        name: '',
        managerId: '',
        profilePicUrl: ''
      });

      const isDarkMode = ref(false);
      const isUserMenuOpen = ref(false);
      const showProfileModal = ref(false);
      const isEditingProfile = ref(false);
      const savingProfile = ref(false);
      const profileForm = ref({
        name: '',
        email: '',
        profilePicUrl: ''
      });

      // Data models based on Data Dictionary
      const users = ref([]);
      const projects = ref([]);
      const tasks = ref([]);
      const assignments = ref([]);

      // Add-task modal state
      const showAddTaskModal = ref(false);
      const showAddProjectModal = ref(false);
      const selectedProject = ref(null);
      const creatingTask = ref(false);
      const creatingProject = ref(false);
      const showAssigneeDropdown = ref(false);
      const newTaskForm = ref({
        taskTitle: '',
        dueDate: '',
        complexity: null,
        description: '',
        priority: null,
        assigneeIds: []
      });
      const newProjectForm = ref({
        projectTitle: '',
        dueDate: '',
        description: '',
        status: 'Not Started'
      });

      // Task details/edit modal state
      const showTaskDetailsModal = ref(false);
      const taskDetailsForm = ref(null);
      const showTaskDetailsAssigneeDropdown = ref(false);
      const isEditingTask = ref(false);
      const savingTask = ref(false);
      const deletingTask = ref(false);
      const completingTask = ref(false);

      // Computed properties
      const currentUser = computed(() => {
        return users.value.find((u) => normalizeEmail(u?.Email) === normalizeEmail(currentUserEmail.value)) || {
          Email: currentUserEmail.value,
          Name: 'Unknown User'
        };
      });

      const assigneeSummary = computed(() => {
        const count = newTaskForm.value.assigneeIds.length;
        if (count === 0) return 'Select assignees';
        if (count === 1) {
          const selectedUser = users.value.find((u) => u.User_ID === newTaskForm.value.assigneeIds[0]);
          return selectedUser ? selectedUser.Name : '1 assignee selected';
        }
        return `${count} assignees selected`;
      });

      const taskDetailsAssigneeSummary = computed(() => {
        const selectedIds = taskDetailsForm.value?.assigneeIds || [];
        if (selectedIds.length === 0) return 'Select assignees';
        if (selectedIds.length === 1) {
          const selectedUser = users.value.find((u) => u.User_ID === selectedIds[0]);
          return selectedUser ? selectedUser.Name : '1 assignee selected';
        }
        return `${selectedIds.length} assignees selected`;
      });

      const taskDetailsAssigneeUsers = computed(() => {
        const selectedIds = taskDetailsForm.value?.assigneeIds || [];
        return selectedIds
          .map((id) => getUserById(id))
          .filter(Boolean);
      });

      const managerOptions = computed(() => {
        const currentEmail = normalizeEmail(currentUserEmail.value);
        return users.value
          .filter((u) => normalizeEmail(u?.Email) !== currentEmail)
          .sort((a, b) => (a?.Name || '').localeCompare(b?.Name || ''));
      });

      // Methods
      const makeLogoTransparent = () => {
        const logo = document.querySelector('.soar-logo');
        if (!logo) return;

        const processLogo = () => {
          const canvas = document.createElement('canvas');
          canvas.width = logo.naturalWidth;
          canvas.height = logo.naturalHeight;

          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          ctx.drawImage(logo, 0, 0);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const pixels = imageData.data;

          const corners = [
            [0, 0],
            [canvas.width - 1, 0],
            [0, canvas.height - 1],
            [canvas.width - 1, canvas.height - 1]
          ];

          let r = 0;
          let g = 0;
          let b = 0;

          corners.forEach(([x, y]) => {
            const index = (y * canvas.width + x) * 4;
            r += pixels[index];
            g += pixels[index + 1];
            b += pixels[index + 2];
          });

          const bgR = r / corners.length;
          const bgG = g / corners.length;
          const bgB = b / corners.length;
          const tolerance = 70;

          const isBgLike = (rVal, gVal, bVal) => {
            const dr = rVal - bgR;
            const dg = gVal - bgG;
            const db = bVal - bgB;
            const distance = Math.sqrt(dr * dr + dg * dg + db * db);
            const nearWhite = rVal > 225 && gVal > 225 && bVal > 225;
            return distance <= tolerance || nearWhite;
          };

          for (let i = 0; i < pixels.length; i += 4) {
            const rVal = pixels[i];
            const gVal = pixels[i + 1];
            const bVal = pixels[i + 2];
            if (isBgLike(rVal, gVal, bVal)) {
              pixels[i + 3] = 0;
            }
          }

          for (let i = 0; i < pixels.length; i += 4) {
            const alpha = pixels[i + 3];
            if (alpha === 0) continue;

            const rVal = pixels[i];
            const gVal = pixels[i + 1];
            const bVal = pixels[i + 2];

            if (rVal < 80 && gVal < 80 && bVal < 80) {
              pixels[i] = 219;
              pixels[i + 1] = 0;
              pixels[i + 2] = 0;
            }
          }

          ctx.putImageData(imageData, 0, 0);
          logo.src = canvas.toDataURL('image/png');
        };

        if (logo.complete) {
          processLogo();
        } else {
          logo.addEventListener('load', processLogo, { once: true });
        }
      };

      const fetchData = () => {
        google.script.run
          .withSuccessHandler((response) => {
            const payload = JSON.parse(response);

            currentUserEmail.value = normalizeEmail(payload.currentUserEmail);
            users.value = payload.users;
            projects.value = payload.projects;
            tasks.value = payload.tasks;
            assignments.value = payload.assignments;
            loading.value = false;

            if (payload.requiresAccountSetup) {
              const fallbackName = currentUserEmail.value.split('@')[0] || '';
              createAccountForm.value.name = fallbackName;
              showCreateAccountModal.value = true;
            } else {
              showCreateAccountModal.value = false;
            }
          })
          .withFailureHandler((error) => {
            console.error('Failed to load data:', error);
            alert('Error loading application data.');
          })
          .getInitialPayload();
      };

      const createAccount = () => {
        const trimmedName = createAccountForm.value.name.trim();
        if (!trimmedName) {
          alert('Please enter your name.');
          return;
        }

        creatingAccount.value = true;
        google.script.run
          .withSuccessHandler((response) => {
            creatingAccount.value = false;
            const result = typeof response === 'string' ? JSON.parse(response) : response;
            if (!result || !result.success || !result.user) {
              alert(result?.error || 'Failed to create account.');
              return;
            }

            const existingUserIndex = users.value.findIndex((user) => user.User_ID === result.user.User_ID);
            if (existingUserIndex >= 0) {
              users.value.splice(existingUserIndex, 1, result.user);
            } else {
              users.value.push(result.user);
            }

            showCreateAccountModal.value = false;
          })
          .withFailureHandler((error) => {
            creatingAccount.value = false;
            console.error('Failed to create account:', error);
            alert('Error creating account.');
          })
          .addUser({
            email: currentUserEmail.value,
            name: trimmedName,
            managerId: createAccountForm.value.managerId,
            profilePicUrl: createAccountForm.value.profilePicUrl
          });
      };

      const getTasksForProject = (projectId) => tasks.value.filter((t) => t.Project_ID === projectId);

      const normalizeEmail = (email) => (email || '').toString().trim().toLowerCase();
      const normalizeId = (value) => (value === null || value === undefined ? '' : value.toString().trim());
      const idsMatch = (left, right) => normalizeId(left) !== '' && normalizeId(left) === normalizeId(right);

      const getAssigneesForTask = (taskId) => {
        const taskAssignments = assignments.value.filter((a) => idsMatch(a.Assignment_ID, taskId));
        return taskAssignments.map((a) => users.value.find((u) => idsMatch(u.User_ID, a.Assignee_ID))).filter(Boolean);
      };

      const getProjectById = (projectId) => projects.value.find((p) => idsMatch(p.Project_ID, projectId)) || null;
      const getUserById = (userId) => users.value.find((u) => idsMatch(u.User_ID, userId)) || null;

      const statusColor = (status) => {
        const colors = {
          'Not Started': 'bg-gray-100 text-gray-600',
          'In Progress': 'bg-[#DB0000]/10 text-[#DB0000]',
          Completed: 'bg-green-100 text-green-700',
          Delayed: 'bg-[#C41425]/10 text-[#C41425]'
        };
        return colors[status] || 'bg-gray-100 text-gray-600';
      };

      const getInitials = (name) => {
        if (!name) return '';
        return name
          .split(' ')
          .map((n) => n[0])
          .join('')
          .substring(0, 2)
          .toUpperCase();
      };

      const formatDate = (dateString) => {
        if (!dateString) return '—';
        const date = new Date(dateString);
        if (Number.isNaN(date.getTime())) return '—';
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      };

      const formatDateForInput = (dateString) => {
        if (!dateString) return '';
        const date = new Date(dateString);
        if (Number.isNaN(date.getTime())) return '';
        return date.toISOString().split('T')[0];
      };

      const isPastDueDate = (dueDateValue) => {
        if (!dueDateValue) return false;
        const dueDate = new Date(dueDateValue);
        if (Number.isNaN(dueDate.getTime())) return false;
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const normalizedDueDate = new Date(dueDate.getFullYear(), dueDate.getMonth(), dueDate.getDate());
        return normalizedDueDate.getTime() < startOfToday.getTime();
      };

      const shouldStrikeTask = (task) => task?.Status === 'Completed' && !isPastDueDate(task?.Due_Date);

      const buildTaskDetailsForm = (task) => {
        return {
          taskId: task.Task_ID,
          taskTitle: task.Task_Title || '',
          description: task.Description || '',
          status: task.Status || 'Not Started',
          complexity: task.Complexity === '' || task.Complexity === null ? null : Number(task.Complexity),
          priority: task.Priority === '' || task.Priority === null ? null : Number(task.Priority),
          createdDate: task.Created_Date || '',
          dueDate: formatDateForInput(task.Due_Date),
          projectId: task.Project_ID || '',
          assigneeIds: getAssigneesForTask(task.Task_ID).map((u) => u.User_ID)
        };
      };

      const openTaskInfo = (task) => {
        taskDetailsForm.value = buildTaskDetailsForm(task);
        isEditingTask.value = false;
        showTaskDetailsAssigneeDropdown.value = false;
        showTaskDetailsModal.value = true;
      };

      const closeTaskInfo = () => {
        if (savingTask.value) return;
        showTaskDetailsModal.value = false;
        showTaskDetailsAssigneeDropdown.value = false;
        isEditingTask.value = false;
        taskDetailsForm.value = null;
      };

      const enableTaskEdit = () => {
        isEditingTask.value = true;
      };

      const cancelTaskEdit = () => {
        if (!taskDetailsForm.value) return;
        const latestTask = tasks.value.find((t) => t.Task_ID === taskDetailsForm.value.taskId);
        if (latestTask) {
          taskDetailsForm.value = buildTaskDetailsForm(latestTask);
        }
        isEditingTask.value = false;
        showTaskDetailsAssigneeDropdown.value = false;
      };

      const toggleTaskDetailsAssignee = (userId) => {
        if (!taskDetailsForm.value || !isEditingTask.value) return;
        const selectedAssignees = taskDetailsForm.value.assigneeIds;
        const index = selectedAssignees.indexOf(userId);
        if (index >= 0) {
          selectedAssignees.splice(index, 1);
        } else {
          selectedAssignees.push(userId);
        }
      };

      const isTaskDetailsAssigneeSelected = (userId) => (taskDetailsForm.value?.assigneeIds || []).includes(userId);

      const saveTaskEdits = () => {
        if (!taskDetailsForm.value) return;

        const trimmedTitle = taskDetailsForm.value.taskTitle.trim();
        if (!trimmedTitle) {
          alert('Task title cannot be empty.');
          return;
        }

        savingTask.value = true;

        google.script.run
          .withSuccessHandler((response) => {
            savingTask.value = false;

            const result = typeof response === 'string' ? JSON.parse(response) : response;
            if (!result || !result.success) {
              alert(result?.error || 'Failed to update task.');
              return;
            }

            const updatedTask = result.task;
            const taskIndex = tasks.value.findIndex((t) => t.Task_ID === updatedTask.Task_ID);
            if (taskIndex >= 0) {
              tasks.value.splice(taskIndex, 1, updatedTask);
            }

            assignments.value = assignments.value.filter((a) => a.Assignment_ID !== updatedTask.Task_ID);
            if (Array.isArray(result.assignments) && result.assignments.length > 0) {
              assignments.value.push(...result.assignments);
            }

            taskDetailsForm.value = buildTaskDetailsForm(updatedTask);
            isEditingTask.value = false;
            showTaskDetailsAssigneeDropdown.value = false;
          })
          .withFailureHandler((error) => {
            savingTask.value = false;
            console.error('Failed to update task:', error);
            alert('Error updating task.');
          })
          .updateTask(taskDetailsForm.value.taskId, {
            taskTitle: trimmedTitle,
            dueDate: taskDetailsForm.value.dueDate,
            status: taskDetailsForm.value.status,
            complexity: taskDetailsForm.value.complexity,
            description: taskDetailsForm.value.description,
            priority: taskDetailsForm.value.priority,
            assigneeIds: taskDetailsForm.value.assigneeIds,
            projectId: taskDetailsForm.value.projectId
          });
      };

      const deleteTask = () => {
        if (!taskDetailsForm.value?.taskId || savingTask.value || deletingTask.value) return;

        const confirmed = confirm('Are you sure you want to delete this task? This action cannot be undone.');
        if (!confirmed) return;

        deletingTask.value = true;

        google.script.run
          .withSuccessHandler((response) => {
            deletingTask.value = false;

            const result = typeof response === 'string' ? JSON.parse(response) : response;
            if (!result || !result.success) {
              alert(result?.error || 'Failed to delete task.');
              return;
            }

            const deletedTaskId = result.taskId;
            tasks.value = tasks.value.filter((task) => !idsMatch(task.Task_ID, deletedTaskId));
            assignments.value = assignments.value.filter((assignment) => !idsMatch(assignment.Assignment_ID, deletedTaskId));

            closeTaskInfo();
          })
          .withFailureHandler((error) => {
            deletingTask.value = false;
            console.error('Failed to delete task:', error);
            alert('Error deleting task.');
          })
          .deleteTask(taskDetailsForm.value.taskId);
      };

      const completeTask = () => {
        if (!taskDetailsForm.value?.taskId || savingTask.value || deletingTask.value || completingTask.value) return;

        completingTask.value = true;

        google.script.run
          .withSuccessHandler((response) => {
            completingTask.value = false;

            const result = typeof response === 'string' ? JSON.parse(response) : response;
            if (!result || !result.success) {
              alert(result?.error || 'Failed to complete task.');
              return;
            }

            if (result.deleted) {
              const deletedTaskId = result.taskId;
              tasks.value = tasks.value.filter((task) => !idsMatch(task.Task_ID, deletedTaskId));
              assignments.value = assignments.value.filter((assignment) => !idsMatch(assignment.Assignment_ID, deletedTaskId));
              closeTaskInfo();
              return;
            }

            if (result.task) {
              const taskIndex = tasks.value.findIndex((task) => idsMatch(task.Task_ID, result.task.Task_ID));
              if (taskIndex >= 0) {
                tasks.value.splice(taskIndex, 1, result.task);
              } else {
                tasks.value.push(result.task);
              }
              taskDetailsForm.value = buildTaskDetailsForm(result.task);
            }
          })
          .withFailureHandler((error) => {
            completingTask.value = false;
            console.error('Failed to complete task:', error);
            alert('Error completing task.');
          })
          .completeTask(taskDetailsForm.value.taskId);
      };

      const resetTaskForm = () => {
        newTaskForm.value = {
          taskTitle: '',
          dueDate: '',
          complexity: null,
          description: '',
          priority: null,
          assigneeIds: []
        };
      };

      const resetProjectForm = () => {
        newProjectForm.value = {
          projectTitle: '',
          dueDate: '',
          description: '',
          status: 'Not Started'
        };
      };

      const openAddProject = () => {
        resetProjectForm();
        showAddProjectModal.value = true;
      };

      const closeAddProject = () => {
        if (creatingProject.value) return;
        showAddProjectModal.value = false;
      };

      const openAddTask = (project) => {
        selectedProject.value = project;
        resetTaskForm();
        showAssigneeDropdown.value = false;
        showAddTaskModal.value = true;
      };

      const closeAddTask = () => {
        if (creatingTask.value) return;
        showAssigneeDropdown.value = false;
        showAddTaskModal.value = false;
        selectedProject.value = null;
      };

      const setComplexity = (value) => {
        newTaskForm.value.complexity = value;
      };

      const setPriority = (value) => {
        newTaskForm.value.priority = value;
      };

      const toggleAssignee = (userId) => {
        const selectedAssignees = newTaskForm.value.assigneeIds;
        const index = selectedAssignees.indexOf(userId);
        if (index >= 0) {
          selectedAssignees.splice(index, 1);
        } else {
          selectedAssignees.push(userId);
        }
      };

      const isAssigneeSelected = (userId) => newTaskForm.value.assigneeIds.includes(userId);

      const createTask = () => {
        const trimmedTitle = newTaskForm.value.taskTitle.trim();
        if (!trimmedTitle) {
          alert('Task title cannot be empty.');
          return;
        }

        if (!selectedProject.value?.Project_ID) {
          alert('No project selected.');
          return;
        }

        creatingTask.value = true;

        google.script.run
          .withSuccessHandler((response) => {
            creatingTask.value = false;

            const result = typeof response === 'string' ? JSON.parse(response) : response;
            if (!result || !result.success) {
              alert(result?.error || 'Failed to create task.');
              return;
            }

            if (result.task) {
              tasks.value.push(result.task);

              if (Array.isArray(result.assignments)) {
                assignments.value.push(...result.assignments);
              }
            } else {
              fetchData();
            }
            closeAddTask();
          })
          .withFailureHandler((error) => {
            creatingTask.value = false;
            console.error('Failed to add task:', error);
            alert('Error creating task.');
          })
          .createTask(selectedProject.value.Project_ID, {
            taskTitle: trimmedTitle,
            dueDate: newTaskForm.value.dueDate,
            complexity: newTaskForm.value.complexity,
            description: newTaskForm.value.description,
            priority: newTaskForm.value.priority,
            assigneeIds: newTaskForm.value.assigneeIds
          });
      };

      const createProject = () => {
        const trimmedTitle = newProjectForm.value.projectTitle.trim();
        if (!trimmedTitle) {
          alert('Project title cannot be empty.');
          return;
        }

        creatingProject.value = true;

        google.script.run
          .withSuccessHandler((response) => {
            creatingProject.value = false;

            const result = typeof response === 'string' ? JSON.parse(response) : response;
            if (!result || !result.success) {
              alert(result?.error || 'Failed to create project.');
              return;
            }

            if (result.project) {
              projects.value.push(result.project);
            } else {
              fetchData();
            }

            closeAddProject();
          })
          .withFailureHandler((error) => {
            creatingProject.value = false;
            console.error('Failed to add project:', error);
            alert('Error creating project.');
          })
          .createProject({
            projectTitle: trimmedTitle,
            dueDate: newProjectForm.value.dueDate,
            description: newProjectForm.value.description,
            status: newProjectForm.value.status || 'Not Started'
          });
      };

      const toggleUserMenu = () => {
        isUserMenuOpen.value = !isUserMenuOpen.value;
      };

      const toggleDarkMode = () => {
        isDarkMode.value = !isDarkMode.value;
      };

      const buildProfileForm = () => ({
        name: currentUser.value?.Name || '',
        email: currentUser.value?.Email || '',
        profilePicUrl: currentUser.value?.Profile_Pic_Url || ''
      });

      const openProfileModal = () => {
        profileForm.value = buildProfileForm();
        isEditingProfile.value = false;
        showProfileModal.value = true;
        isUserMenuOpen.value = false;
      };

      const closeProfileModal = () => {
        if (savingProfile.value) return;
        showProfileModal.value = false;
        isEditingProfile.value = false;
      };

      const enableProfileEdit = () => {
        isEditingProfile.value = true;
      };

      const cancelProfileEdit = () => {
        profileForm.value = buildProfileForm();
        isEditingProfile.value = false;
      };

      const saveProfile = () => {
        const trimmedName = (profileForm.value?.name || '').trim();
        const trimmedEmail = (profileForm.value?.email || '').trim();
        const trimmedProfilePicUrl = (profileForm.value?.profilePicUrl || '').trim();

        if (!trimmedName) {
          alert('Name is required.');
          return;
        }
        if (!trimmedEmail) {
          alert('Email is required.');
          return;
        }

        savingProfile.value = true;
        google.script.run
          .withSuccessHandler((response) => {
            savingProfile.value = false;
            const result = typeof response === 'string' ? JSON.parse(response) : response;
            if (!result || !result.success || !result.user) {
              alert(result?.error || 'Failed to update profile.');
              return;
            }

            const updatedUser = result.user;
            const userIndex = users.value.findIndex((u) => idsMatch(u.User_ID, updatedUser.User_ID));
            if (userIndex >= 0) {
              users.value.splice(userIndex, 1, updatedUser);
            } else {
              users.value.push(updatedUser);
            }

            currentUserEmail.value = updatedUser.Email || trimmedEmail;
            profileForm.value = buildProfileForm();
            isEditingProfile.value = false;
          })
          .withFailureHandler((error) => {
            savingProfile.value = false;
            console.error('Failed to update profile:', error);
            alert('Error updating profile.');
          })
          .updateCurrentUserProfile({
            name: trimmedName,
            email: trimmedEmail,
            profilePicUrl: trimmedProfilePicUrl
          });
      };

      onMounted(() => {
        fetchData();
        makeLogoTransparent();
      });

      return {
        loading,
        isDarkMode,
        isUserMenuOpen,
        showCreateAccountModal,
        createAccountForm,
        creatingAccount,
        managerOptions,
        currentUser,
        users,
        projects,
        tasks,
        showProfileModal,
        isEditingProfile,
        savingProfile,
        profileForm,
        showAddTaskModal,
        showAddProjectModal,
        selectedProject,
        creatingTask,
        creatingProject,
        showAssigneeDropdown,
        assigneeSummary,
        newTaskForm,
        newProjectForm,
        showTaskDetailsModal,
        taskDetailsForm,
        showTaskDetailsAssigneeDropdown,
        taskDetailsAssigneeSummary,
        taskDetailsAssigneeUsers,
        isEditingTask,
        savingTask,
        deletingTask,
        completingTask,
        getTasksForProject,
        getAssigneesForTask,
        getProjectById,
        statusColor,
        getInitials,
        formatDate,
        shouldStrikeTask,
        openTaskInfo,
        openAddProject,
        closeAddProject,
        closeTaskInfo,
        enableTaskEdit,
        cancelTaskEdit,
        toggleTaskDetailsAssignee,
        isTaskDetailsAssigneeSelected,
        saveTaskEdits,
        deleteTask,
        completeTask,
        openAddTask,
        closeAddTask,
        setComplexity,
        setPriority,
        toggleAssignee,
        isAssigneeSelected,
        createTask,
        createProject,
        createAccount,
        toggleUserMenu,
        toggleDarkMode,
        openProfileModal,
        closeProfileModal,
        enableProfileEdit,
        cancelProfileEdit,
        saveProfile
      };
    }
  }).mount('#app');
</script>
