<script>
  const { createApp, ref, computed, onMounted } = Vue;

  createApp({
    setup() {
      const loading = ref(true);
      const currentUserEmail = ref('');

      const isDarkMode = ref(false);
      const isUserMenuOpen = ref(false);
      
      // Data models based on Data Dictionary
      const users = ref([]);
      const projects = ref([]);
      const tasks = ref([]);
      const assignments = ref([]);

      const showAddTaskModal = ref(false);
      const selectedProject = ref(null);
      const creatingTask = ref(false);
      const showAssigneeDropdown = ref(false);
      const newTaskForm = ref({
        taskTitle: '',
        dueDate: '',
        complexity: null,
        description: '',
        priority: null,
        assigneeIds: []
      });

      // Computed properties
      const currentUser = computed(() => {
        return users.value.find(u => u.Email === currentUserEmail.value) || { Email: currentUserEmail.value, Name: 'Unknown User' };
      });

      // Methods
      const makeLogoTransparent = () => {
        const logo = document.querySelector('.soar-logo');
        if (!logo) return;

        const processLogo = () => {
          const canvas = document.createElement('canvas');
          canvas.width = logo.naturalWidth;
          canvas.height = logo.naturalHeight;

          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          ctx.drawImage(logo, 0, 0);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const pixels = imageData.data;

          const corners = [
            [0, 0],
            [canvas.width - 1, 0],
            [0, canvas.height - 1],
            [canvas.width - 1, canvas.height - 1]
          ];

          let r = 0, g = 0, b = 0;
          corners.forEach(([x, y]) => {
            const index = (y * canvas.width + x) * 4;
            r += pixels[index];
            g += pixels[index + 1];
            b += pixels[index + 2];
          });

          const bgR = r / corners.length;
          const bgG = g / corners.length;
          const bgB = b / corners.length;
          const tolerance = 70;

          const isBgLike = (rVal, gVal, bVal) => {
            const dr = rVal - bgR;
            const dg = gVal - bgG;
            const db = bVal - bgB;
            const distance = Math.sqrt(dr * dr + dg * dg + db * db);
            const nearWhite = rVal > 225 && gVal > 225 && bVal > 225;
            return distance <= tolerance || nearWhite;
          };

          // Remove any pixel close to detected background color (or near-white).
          for (let i = 0; i < pixels.length; i += 4) {
            const rVal = pixels[i];
            const gVal = pixels[i + 1];
            const bVal = pixels[i + 2];
            if (isBgLike(rVal, gVal, bVal)) {
              pixels[i + 3] = 0;
            }
          }

          // Recolor dark logo strokes to brand red.
          for (let i = 0; i < pixels.length; i += 4) {
            const alpha = pixels[i + 3];
            if (alpha === 0) continue;

            const rVal = pixels[i];
            const gVal = pixels[i + 1];
            const bVal = pixels[i + 2];

            if (rVal < 80 && gVal < 80 && bVal < 80) {
              pixels[i] = 219;     // #DB0000
              pixels[i + 1] = 0;
              pixels[i + 2] = 0;
            }
          }

          ctx.putImageData(imageData, 0, 0);
          logo.src = canvas.toDataURL('image/png');
        };

        if (logo.complete) {
          processLogo();
        } else {
          logo.addEventListener('load', processLogo, { once: true });
        }
      };

      const fetchData = () => {
        google.script.run
          .withSuccessHandler((response) => {
            // Parse the stringified JSON back into a JavaScript object
            const payload = JSON.parse(response);

            currentUserEmail.value = payload.currentUserEmail;
            users.value = payload.users;
            projects.value = payload.projects;
            tasks.value = payload.tasks;
            assignments.value = payload.assignments;
            loading.value = false;
          })
          .withFailureHandler((error) => {
            console.error('Failed to load data:', error);
            alert('Error loading application data.');
          })
          .getInitialPayload();
      };

      const getTasksForProject = (projectId) => {
        return tasks.value.filter(t => t.Project_ID === projectId);
      };

      const getAssigneesForTask = (taskId) => {
        // Find assignments for this task (using Topic_ID/Assignment_ID alias concept from README)
        const taskAssignments = assignments.value.filter(a => a.Assignment_ID === taskId);
        // Map assignee IDs to actual User objects
        return taskAssignments.map(a => users.value.find(u => u.User_ID === a.Assignee_ID)).filter(Boolean);
      };

      const statusColor = (status) => {
        const colors = {
          'Not Started': 'bg-gray-100 text-gray-600',
          'In Progress': 'bg-[#DB0000]/10 text-[#DB0000]',
          'Completed': 'bg-green-100 text-green-700',
          'Delayed': 'bg-[#C41425]/10 text-[#C41425]'
        };
        return colors[status] || 'bg-gray-100 text-gray-600';
      };

      const getInitials = (name) => {
        if (!name) return '';
        return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
      };

      const formatDate = (dateString) => {
        if (!dateString) return '';
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      };

      const openTaskInfo = (task) => {
        // Placeholder for the detailed modal you requested (comments, drive links, etc.)
        console.log('Opening task modal for:', task.Task_Title);
        alert(`Opening details for: ${task.Task_Title}\n(Next Step: Build the Task Detail Modal!)`);
      };

      const resetTaskForm = () => {
        newTaskForm.value = {
          taskTitle: '',
          dueDate: '',
          complexity: null,
          description: '',
          priority: null,
          assigneeIds: []
        };
      };

      const openAddTask = (project) => {
        selectedProject.value = project;
        resetTaskForm();
        showAssigneeDropdown.value = false;
        showAddTaskModal.value = true;
      };

      const closeAddTask = () => {
        if (creatingTask.value) return;
        showAssigneeDropdown.value = false;
        showAddTaskModal.value = false;
        selectedProject.value = null;
      };

      const setComplexity = (value) => {
        newTaskForm.value.complexity = value;
      };

      const setPriority = (value) => {
        newTaskForm.value.priority = value;
      };

      const toggleAssignee = (userId) => {
        const selectedAssignees = newTaskForm.value.assigneeIds;
        const index = selectedAssignees.indexOf(userId);
        if (index >= 0) {
          selectedAssignees.splice(index, 1);
        } else {
          selectedAssignees.push(userId);
        }
      };

      const isAssigneeSelected = (userId) => newTaskForm.value.assigneeIds.includes(userId);

      const assigneeSummary = computed(() => {
        const count = newTaskForm.value.assigneeIds.length;
        if (count === 0) return 'Select assignees';
        if (count === 1) {
          const selectedUser = users.value.find((u) => u.User_ID === newTaskForm.value.assigneeIds[0]);
          return selectedUser ? selectedUser.Name : '1 assignee selected';
        }
        return `${count} assignees selected`;
      });

      const createTask = () => {
        const trimmedTitle = newTaskForm.value.taskTitle.trim();
        if (!trimmedTitle) {
          alert('Task title cannot be empty.');
          return;
        }

        if (!selectedProject.value?.Project_ID) {
          alert('No project selected.');
          return;
        }

        creatingTask.value = true;

        google.script.run
          .withSuccessHandler((response) => {
            creatingTask.value = false;

            const result = typeof response === 'string' ? JSON.parse(response) : response;
            if (!result || !result.success) {
              alert(result?.error || 'Failed to create task.');
              return;
            }

            if (result.task) {
              tasks.value.push(result.task);

              if (Array.isArray(result.assignments)) {
                assignments.value.push(...result.assignments);
              }
            } else {
              fetchData();
            }
            closeAddTask();
          })
          .withFailureHandler((error) => {
            creatingTask.value = false;
            console.error('Failed to add task:', error);
            alert('Error creating task.');
          })
          .createTask(selectedProject.value.Project_ID, {
            taskTitle: trimmedTitle,
            dueDate: newTaskForm.value.dueDate,
            complexity: newTaskForm.value.complexity,
            description: newTaskForm.value.description,
            priority: newTaskForm.value.priority,
            assigneeIds: newTaskForm.value.assigneeIds
          });
      };

      const toggleUserMenu = () => {
        isUserMenuOpen.value = !isUserMenuOpen.value;
      };

      const toggleDarkMode = () => {
        isDarkMode.value = !isDarkMode.value;
      };

      // Lifecycle hooks
      onMounted(() => {
        fetchData();
        makeLogoTransparent();
      });

      return {
        loading,
        isDarkMode,
        isUserMenuOpen,
        currentUser,
        projects,
        tasks,
        showAddTaskModal,
        selectedProject,
        creatingTask,
        users,
        showAssigneeDropdown,
        assigneeSummary,
        newTaskForm,
        getTasksForProject,
        getAssigneesForTask,
        statusColor,
        getInitials,
        formatDate,
        openTaskInfo,
        openAddTask,
        closeAddTask,
        setComplexity,
        setPriority,
        toggleAssignee,
        isAssigneeSelected,
        createTask,
        toggleUserMenu,
        toggleDarkMode
      };
    }
  }).mount('#app');
</script>
