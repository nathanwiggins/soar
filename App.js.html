<script>
  const { createApp, ref, computed, onMounted, nextTick } = Vue;

  createApp({
    setup() {
      const loading = ref(true);
      const currentUserEmail = ref('');
      const showCreateAccountModal = ref(false);
      const creatingAccount = ref(false);
      const createAccountForm = ref({
        name: '',
        managerId: '',
      });

      const isDarkMode = ref(false);
      const isUserMenuOpen = ref(false);
      const showProfileModal = ref(false);
      const showSettingsModal = ref(false);
      const savingSettings = ref(false);
      const isEditingProfile = ref(false);
      const savingProfile = ref(false);
      const profileForm = ref({
        name: '',
        email: '',
      });
      const settingsForm = ref({
        fontScale: 100,
        notifications: {
          taskAssignments: true,
          commentsAndMentions: true,
          dueDateReminders: true,
          weeklyDigest: false
        }
      });

      const users = ref([]);
      const projects = ref([]);
      const tasks = ref([]);
      const subtasks = ref([]);
      const newSubtaskTitle = ref('');
      const creatingSubtask = ref(false);
      const assignments = ref([]);
      const comments = ref([]);
      const dataVersionHash = ref('');
      const loadedCommentTopicIds = ref([]);
      const loadingCommentTopicIds = ref([]);
      const commentDraft = ref('');
      const creatingComment = ref(false);
      const resolvingCommentIds = ref([]);
      const deletingCommentIds = ref([]);
      const showCommentModal = ref(false);
      const commentModalTask = ref(null);
      const activeCommentTaskId = ref('');
      const showMentionSuggestions = ref(false);
      const mentionQuery = ref('');
      const mentionStartIndex = ref(-1);
      const mentionCursorIndex = ref(-1);
      const quickCommentTextarea = ref(null);
      const showAllWorkItems = ref(false);
      const currentTab = ref('project-board');
      const showSupervisorUserDropdown = ref(false);
      const selectedSupervisorUserIds = ref([]);
      const INITIAL_PAYLOAD_CACHE_KEY = 'soar_initial_payload_v2';
      const LOGO_CACHE_KEY = 'soar_processed_logo_v1';
      const memoCache = new Map();

      const getItemSignature = (item, idKey, fields) => [
        item?.[idKey] || '',
        ...fields.map((field) => item?.[field] || '')
      ].join('~');

      const getCollectionSignature = (items, idKey, fields = []) => {
        if (!Array.isArray(items)) return '0';
        return `${items.length}:${items.map((item) => getItemSignature(item, idKey, fields)).join('|')}`;
      };

      const memoizeBySignature = (cacheKey, signature, factory) => {
        const cached = memoCache.get(cacheKey);
        if (cached && cached.signature === signature) return cached.value;
        const value = factory();
        memoCache.set(cacheKey, { signature, value });
        return value;
      };

      const taskStatusOptions = ['Not Started', 'In Progress', 'Completed', 'Delayed'];

      const showAddTaskModal = ref(false);
      const showAddProjectModal = ref(false);
      const selectedProject = ref(null);
      const creatingTask = ref(false);
      const creatingProject = ref(false);
      const showAssigneeDropdown = ref(false);
      const newDraftSubtask = ref('');
      const newTaskForm = ref({
        taskTitle: '',
        dueDate: '',
        description: '',
        priority: '',
        assigneeIds: [],
        subtasks: []
      });
      const newProjectForm = ref({
        projectTitle: '',
        dueDate: '',
        description: '',
        status: 'Not Started'
      });

      const showTaskDetailsModal = ref(false);
      const taskDetailsForm = ref(null);
      const showTaskDetailsAssigneeDropdown = ref(false);
      const isEditingTask = ref(false);
      const savingTask = ref(false);
      const deletingTask = ref(false);
      const completingTask = ref(false);
      const updatingTaskStatusIds = ref([]);
      const permanentlyDeletingTaskIds = ref([]);
      const showProjectDetailsModal = ref(false);
      const projectDetailsForm = ref(null);
      const deletingProject = ref(false);
      const isEditingProject = ref(false);
      const savingProject = ref(false);

      const currentUser = computed(() => {
        return userStats.value.usersByEmail.get(normalizeEmail(currentUserEmail.value)) || {
          Email: currentUserEmail.value,
          Name: 'Unknown User'
        };
      });

      const assigneeSummary = computed(() => {
        const count = newTaskForm.value.assigneeIds.length;
        if (count === 0) return 'Select assignees';
        if (count === 1) {
          const selectedUser = userStats.value.usersById.get(normalizeId(newTaskForm.value.assigneeIds[0]));
          return selectedUser ? selectedUser.Name : '1 assignee selected';
        }
        return `${count} assignees selected`;
      });

      const taskDetailsAssigneeSummary = computed(() => {
        const selectedIds = taskDetailsForm.value?.assigneeIds || [];
        if (selectedIds.length === 0) return 'Select assignees';
        if (selectedIds.length === 1) {
          const selectedUser = userStats.value.usersById.get(normalizeId(selectedIds[0]));
          return selectedUser ? selectedUser.Name : '1 assignee selected';
        }
        return `${selectedIds.length} assignees selected`;
      });

      const taskDetailsAssigneeUsers = computed(() => {
        const selectedIds = taskDetailsForm.value?.assigneeIds || [];
        return selectedIds
          .map((id) => getUserById(id))
          .filter(Boolean);
      });

      const projectDetailsCreator = computed(() => {
        if (!projectDetailsForm.value?.creatorId) return null;
        return getUserById(projectDetailsForm.value.creatorId);
      });

      const completedTaskByUser = computed(() => {
        if (!taskDetailsForm.value?.completedById) return null;
        return getUserById(taskDetailsForm.value.completedById);
      });

      const taskComments = computed(() => {
        const topicId = activeCommentTaskId.value;
        if (!topicId) return [];

        return comments.value
          .filter((comment) => idsMatch(comment.Topic_ID, topicId))
          .slice()
          .sort((left, right) => {
            const leftTime = new Date(left.Timestamp || 0).getTime();
            const rightTime = new Date(right.Timestamp || 0).getTime();
            return rightTime - leftTime;
          });
      });

      const mentionableUsers = computed(() => {
        const byHandle = new Map();
        users.value.forEach((user) => {
          const emailLocalPart = normalizeEmail(user?.Email).split('@')[0];
          const fallbackHandle = (user?.Name || '')
            .toString()
            .trim()
            .toLowerCase()
            .replace(/\s+/g, '.')
            .replace(/[^a-z0-9._-]/g, '');
          const handle = emailLocalPart || fallbackHandle;
          if (!handle) return;

          if (!byHandle.has(handle)) {
            byHandle.set(handle, {
              handle,
              userId: user.User_ID,
              name: user.Name || '',
              email: user.Email || ''
            });
          }
        });

        return Array.from(byHandle.values()).sort((a, b) => a.handle.localeCompare(b.handle));
      });

      const filteredMentionSuggestions = computed(() => {
        if (!showMentionSuggestions.value) return [];
        const query = mentionQuery.value.toLowerCase();
        return mentionableUsers.value
          .filter((entry) => !query || entry.handle.toLowerCase().startsWith(query))
          .slice(0, 6);
      });

      const managerOptions = computed(() => {
        const currentEmail = normalizeEmail(currentUserEmail.value);
        return users.value
          .filter((u) => normalizeEmail(u?.Email) !== currentEmail)
          .sort((a, b) => (a?.Name || '').localeCompare(b?.Name || ''));
      });

      const currentUserId = computed(() => {
        return currentUser.value?.User_ID ? currentUser.value.User_ID.toString().trim() : '';
      });

      const userStats = computed(() => {
        const signature = [
          getCollectionSignature(users.value, 'User_ID', ['Email', 'Name', 'Manager_ID', 'Profile_Pic_Url']),
          getCollectionSignature(assignments.value, 'Assignment_ID', ['Assignee_ID'])
        ].join('::');

        return memoizeBySignature('userStats', signature, () => {
          const usersById = new Map();
          const usersByEmail = new Map();
          const directReportsByManagerId = new Map();
          users.value.forEach((user) => {
            const userId = normalizeId(user?.User_ID);
            const userEmail = normalizeEmail(user?.Email);
            const managerId = normalizeId(user?.Manager_ID);
            if (userId) usersById.set(userId, user);
            if (userEmail) usersByEmail.set(userEmail, user);
            if (managerId && userId) {
              if (!directReportsByManagerId.has(managerId)) directReportsByManagerId.set(managerId, []);
              directReportsByManagerId.get(managerId).push(user);
            }
          });

          const assignmentsByUserId = new Map();
          const assigneesByTaskId = new Map();
          assignments.value.forEach((assignment) => {
            const assignmentId = normalizeId(assignment?.Assignment_ID);
            const assigneeId = normalizeId(assignment?.Assignee_ID);
            if (!assignmentId || !assigneeId) return;

            if (!assignmentsByUserId.has(assigneeId)) assignmentsByUserId.set(assigneeId, new Set());
            assignmentsByUserId.get(assigneeId).add(assignmentId);

            if (!assigneesByTaskId.has(assignmentId)) assigneesByTaskId.set(assignmentId, []);
            const user = usersById.get(assigneeId);
            if (user) assigneesByTaskId.get(assignmentId).push(user);
          });

          directReportsByManagerId.forEach((reportUsers) => {
            reportUsers.sort((a, b) => (a?.Name || '').localeCompare(b?.Name || ''));
          });

          return { usersById, usersByEmail, directReportsByManagerId, assignmentsByUserId, assigneesByTaskId };
        });
      });

      const assignedEntityIdsForCurrentUser = computed(() => {
        const userId = currentUserId.value;
        if (!userId) return new Set();
        return userStats.value.assignmentsByUserId.get(userId) || new Set();
      });

      const filteredTasks = computed(() => {
        const signature = [
          getCollectionSignature(tasks.value, 'Task_ID', ['Project_ID', 'Status', 'Due_Date', 'Priority', 'Task_Title']),
          getCollectionSignature(assignments.value, 'Assignment_ID', ['Assignee_ID']),
          currentUserId.value,
          showAllWorkItems.value ? 'all' : 'assigned'
        ].join('::');

        return memoizeBySignature('filteredTasks', signature, () => {
          if (showAllWorkItems.value) return tasks.value;
          const assignedIds = assignedEntityIdsForCurrentUser.value;
          return tasks.value.filter((task) => {
            if (task?.Status === 'Completed') return false;
            return assignedIds.has(normalizeId(task?.Task_ID));
          });
        });
      });

      const visibleTasks = filteredTasks;

      const pastAssignments = computed(() => {
        const assignedIds = assignedEntityIdsForCurrentUser.value;
        return tasks.value
          .filter((task) => task?.Status === 'Completed' && assignedIds.has(normalizeId(task?.Task_ID)))
          .slice()
          .sort((left, right) => {
            const leftTime = parseAsLocalDate(left?.Due_Date || 0).getTime();
            const rightTime = parseAsLocalDate(right?.Due_Date || 0).getTime();
            return rightTime - leftTime;
          });
      });

      const visibleProjects = computed(() => {
        if (showAllWorkItems.value) return projects.value;
        const assignedIds = assignedEntityIdsForCurrentUser.value;
        const visibleProjectIds = new Set(
          visibleTasks.value
            .map((task) => normalizeId(task?.Project_ID))
            .filter(Boolean)
        );

        return projects.value.filter((project) => {
          const projectId = normalizeId(project?.Project_ID);
          return assignedIds.has(projectId) || visibleProjectIds.has(projectId);
        });
      });

      const directReportUsers = computed(() => {
        const managerId = currentUserId.value;
        if (!managerId) return [];
        return userStats.value.directReportsByManagerId.get(managerId) || [];
      });

      const assignableUsers = computed(() => {
        const normalizedCurrentUserId = normalizeId(currentUserId.value);
        if (!normalizedCurrentUserId) return [];

        const assignableIdSet = new Set([normalizedCurrentUserId]);
        const queue = [normalizedCurrentUserId];
        while (queue.length > 0) {
          const managerId = queue.shift();
          const directReports = userStats.value.directReportsByManagerId.get(managerId) || [];
          directReports.forEach((reportUser) => {
            const reportId = normalizeId(reportUser?.User_ID);
            if (reportId && !assignableIdSet.has(reportId)) {
              assignableIdSet.add(reportId);
              queue.push(reportId);
            }
          });
        }

        return Array.from(assignableIdSet)
          .map((userId) => userStats.value.usersById.get(userId))
          .filter(Boolean)
          .sort((a, b) => (a?.Name || '').localeCompare(b?.Name || ''));
      });

      const supervisorUserSummary = computed(() => {
        const count = selectedSupervisorUserIds.value.length;
        if (count === 0) return 'Select team members';
        if (count === 1) {
          const selectedUser = userStats.value.usersById.get(normalizeId(selectedSupervisorUserIds.value[0]));
          return selectedUser?.Name || '1 team member selected';
        }
        return `${count} team members selected`;
      });

      const assignedEntityIdsForSelectedSupervisorUsers = computed(() => {
        if (selectedSupervisorUserIds.value.length === 0) return new Set();
        const selectedUserIdSet = new Set(selectedSupervisorUserIds.value.map((id) => normalizeId(id)).filter(Boolean));
        const ids = new Set();
        selectedUserIdSet.forEach((userId) => {
          const assignmentIds = userStats.value.assignmentsByUserId.get(userId);
          if (!assignmentIds) return;
          assignmentIds.forEach((assignmentId) => ids.add(assignmentId));
        });
        return ids;
      });

      const supervisorVisibleTasks = computed(() => {
        const assignedIds = assignedEntityIdsForSelectedSupervisorUsers.value;
        return tasks.value.filter((task) => {
          if (task?.Status === 'Completed') return false;
          return assignedIds.has(normalizeId(task?.Task_ID));
        });
      });

      const supervisorVisibleProjects = computed(() => {
        const assignedIds = assignedEntityIdsForSelectedSupervisorUsers.value;
        const visibleProjectIds = new Set(
          supervisorVisibleTasks.value
            .map((task) => normalizeId(task?.Project_ID))
            .filter(Boolean)
        );

        return projects.value.filter((project) => {
          const projectId = normalizeId(project?.Project_ID);
          return assignedIds.has(projectId) || visibleProjectIds.has(projectId);
        });
      });

      const projectSummaries = computed(() => {
        const signature = [
          getCollectionSignature(projects.value, 'Project_ID', ['Project_Title', 'Status', 'Due_Date']),
          getCollectionSignature(visibleTasks.value, 'Task_ID', ['Project_ID', 'Status', 'Due_Date', 'Priority', 'Task_Title']),
          getCollectionSignature(supervisorVisibleTasks.value, 'Task_ID', ['Project_ID', 'Status', 'Due_Date', 'Priority', 'Task_Title'])
        ].join('::');

        return memoizeBySignature('projectSummaries', signature, () => {
          const summaries = new Map();
          projects.value.forEach((project) => {
            const projectId = normalizeId(project?.Project_ID);
            if (!projectId) return;
            summaries.set(projectId, { project, tasks: [], supervisorTasks: [] });
          });

          visibleTasks.value.forEach((task) => {
            const projectId = normalizeId(task?.Project_ID);
            if (!summaries.has(projectId)) summaries.set(projectId, { project: null, tasks: [], supervisorTasks: [] });
            summaries.get(projectId).tasks.push(task);
          });

          supervisorVisibleTasks.value.forEach((task) => {
            const projectId = normalizeId(task?.Project_ID);
            if (!summaries.has(projectId)) summaries.set(projectId, { project: null, tasks: [], supervisorTasks: [] });
            summaries.get(projectId).supervisorTasks.push(task);
          });

          summaries.forEach((summary) => {
            summary.tasks.sort(compareTasksByPriority);
            summary.supervisorTasks.sort(compareTasksByPriority);
          });

          return summaries;
        });
      });

      const fontScaleLabel = computed(() => {
        const scale = Number(settingsForm.value?.fontScale) || 100;
        if (scale <= 90) return 'Smaller';
        if (scale >= 115) return 'Larger';
        return 'Default';
      });

      const readSessionStorage = (key) => {
        try {
          return sessionStorage.getItem(key);
        } catch (error) {
          console.warn(`Unable to read sessionStorage key ${key}:`, error);
          return null;
        }
      };

      const writeSessionStorage = (key, value) => {
        try {
          sessionStorage.setItem(key, value);
        } catch (error) {
          console.warn(`Unable to write sessionStorage key ${key}:`, error);
        }
      };

      const makeLogoTransparent = () => {
        const logo = document.querySelector('.soar-logo');
        if (!logo) return;

        const cachedLogo = readSessionStorage(LOGO_CACHE_KEY);
        if (cachedLogo) {
          logo.src = cachedLogo;
          return;
        }

        const processLogo = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = logo.naturalWidth;
            canvas.height = logo.naturalHeight;
            if (!canvas.width || !canvas.height) return;

            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            ctx.drawImage(logo, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;

            const corners = [
              [0, 0],
              [canvas.width - 1, 0],
              [0, canvas.height - 1],
              [canvas.width - 1, canvas.height - 1]
            ];

            let r = 0;
            let g = 0;
            let b = 0;

            corners.forEach(([x, y]) => {
              const index = (y * canvas.width + x) * 4;
              r += pixels[index];
              g += pixels[index + 1];
              b += pixels[index + 2];
            });

            const bgR = r / corners.length;
            const bgG = g / corners.length;
            const bgB = b / corners.length;
            const tolerance = 70;

            const isBgLike = (rVal, gVal, bVal) => {
              const dr = rVal - bgR;
              const dg = gVal - bgG;
              const db = bVal - bgB;
              const distance = Math.sqrt(dr * dr + dg * dg + db * db);
              const nearWhite = rVal > 225 && gVal > 225 && bVal > 225;
              return distance <= tolerance || nearWhite;
            };

            for (let i = 0; i < pixels.length; i += 4) {
              const rVal = pixels[i];
              const gVal = pixels[i + 1];
              const bVal = pixels[i + 2];
              if (isBgLike(rVal, gVal, bVal)) {
                pixels[i + 3] = 0;
              }
            }

            for (let i = 0; i < pixels.length; i += 4) {
              const alpha = pixels[i + 3];
              if (alpha === 0) continue;

              const rVal = pixels[i];
              const gVal = pixels[i + 1];
              const bVal = pixels[i + 2];

              if (rVal < 80 && gVal < 80 && bVal < 80) {
                pixels[i] = 219;
                pixels[i + 1] = 0;
                pixels[i + 2] = 0;
              }
            }

            ctx.putImageData(imageData, 0, 0);
            const processedLogo = canvas.toDataURL('image/png');
            logo.src = processedLogo;
            writeSessionStorage(LOGO_CACHE_KEY, processedLogo);
          } catch (error) {
            console.warn('Unable to process logo transparency:', error);
          }
        };

        const processWhenReady = () => {
          if (logo.complete) {
            processLogo();
          } else {
            logo.addEventListener('load', processLogo, { once: true });
          }
        };

        const scheduleIdle = window.requestIdleCallback || ((callback) => window.setTimeout(callback, 1));
        scheduleIdle(processWhenReady, { timeout: 2000 });
      };

      const readInitialPayloadCache = () => {
        try {
          const rawCache = localStorage.getItem(INITIAL_PAYLOAD_CACHE_KEY);
          if (!rawCache) return null;
          const parsedCache = JSON.parse(rawCache);
          if (!parsedCache || !parsedCache.versionHash || !parsedCache.payload) {
            localStorage.removeItem(INITIAL_PAYLOAD_CACHE_KEY);
            return null;
          }
          return parsedCache;
        } catch (error) {
          console.warn('Initial payload cache is corrupted; falling back to a full fetch.', error);
          try {
            localStorage.removeItem(INITIAL_PAYLOAD_CACHE_KEY);
          } catch (removeError) {
            console.warn('Unable to remove corrupted initial payload cache:', removeError);
          }
          return null;
        }
      };

      const writeInitialPayloadCache = (payload) => {
        if (!payload?.versionHash) return;
        try {
          localStorage.setItem(INITIAL_PAYLOAD_CACHE_KEY, JSON.stringify({
            versionHash: payload.versionHash,
            lastUpdated: payload.lastUpdated || '',
            cachedAt: new Date().toISOString(),
            payload: {
              currentUserEmail: payload.currentUserEmail,
              currentUserExists: payload.currentUserExists,
              requiresAccountSetup: payload.requiresAccountSetup,
              users: payload.users || [],
              projects: payload.projects || [],
              tasks: payload.tasks || [],
              tasks: payload.tasks || [],
              subtasks: payload.subtasks || [],
              assignments: payload.assignments || [],
              assignments: payload.assignments || [],
              currentUserSettings: payload.currentUserSettings || {},
              versionHash: payload.versionHash,
              lastUpdated: payload.lastUpdated || ''
            }
          }));
        } catch (error) {
          console.warn('Unable to persist initial payload cache:', error);
        }
      };

      const applyInitialPayload = (payload) => {
        if (!payload) throw new Error('Initial payload was empty.');

        currentUserEmail.value = normalizeEmail(payload.currentUserEmail);
        users.value = Array.isArray(payload.users) ? payload.users : [];
        projects.value = Array.isArray(payload.projects) ? payload.projects : [];
        tasks.value = Array.isArray(payload.tasks) ? payload.tasks : [];
        subtasks.value = Array.isArray(payload.subtasks) ? payload.subtasks : [];
        assignments.value = Array.isArray(payload.assignments) ? payload.assignments : [];
        comments.value = [];
        loadedCommentTopicIds.value = [];
        loadingCommentTopicIds.value = [];
        dataVersionHash.value = payload.versionHash || '';
        applyNotificationSettings(payload.currentUserSettings?.notifications);
        loading.value = false;

        if (payload.requiresAccountSetup) {
          const fallbackName = currentUserEmail.value.split('@')[0] || '';
          createAccountForm.value.name = fallbackName;
          showCreateAccountModal.value = true;
        } else {
          showCreateAccountModal.value = false;
        }
      };

      const fetchInitialPayloadFromServer = () => {
        google.script.run
          .withSuccessHandler((response) => {
            const payload = parseRunResponse(response);
            writeInitialPayloadCache(payload);
            applyInitialPayload(payload);
          })
          .withFailureHandler((error) => {
            console.error('Failed to load data:', error);
            alert('Error loading application data.');
          })
          .getInitialPayload();
      };

      const fetchData = () => {
        loading.value = true;
        google.script.run
          .withSuccessHandler((response) => {
            const versionInfo = parseRunResponse(response);
            const cachedPayload = readInitialPayloadCache();

            const cachedUserEmail = normalizeEmail(cachedPayload?.payload?.currentUserEmail);
            const versionUserEmail = normalizeEmail(versionInfo?.currentUserEmail);
            if (
              versionInfo?.success &&
              cachedPayload?.versionHash === versionInfo.versionHash &&
              cachedUserEmail === versionUserEmail
            ) {
              try {
                applyInitialPayload(cachedPayload.payload);
                return;
              } catch (error) {
                console.warn('Cached payload could not be hydrated; performing full fetch.', error);
                try {
                  localStorage.removeItem(INITIAL_PAYLOAD_CACHE_KEY);
                } catch (removeError) {
                  console.warn('Unable to remove invalid initial payload cache:', removeError);
                }
              }
            }

            fetchInitialPayloadFromServer();
          })
          .withFailureHandler((error) => {
            console.warn('Failed to check global data version; performing full fetch.', error);
            fetchInitialPayloadFromServer();
          })
          .getGlobalVersionHash();
      };

      const createAccount = () => {
        const trimmedName = createAccountForm.value.name.trim();
        if (!trimmedName) {
          alert('Please enter your name.');
          return;
        }

        creatingAccount.value = true;
        google.script.run
          .withSuccessHandler((response) => {
            creatingAccount.value = false;
            const result = typeof response === 'string' ? JSON.parse(response) : response;
            if (!result || !result.success || !result.user) {
              alert(result?.error || 'Failed to create account.');
              return;
            }

            const existingUserIndex = users.value.findIndex((user) => user.User_ID === result.user.User_ID);
            if (existingUserIndex >= 0) {
              users.value.splice(existingUserIndex, 1, result.user);
            } else {
              users.value.push(result.user);
            }

            showCreateAccountModal.value = false;
          })
          .withFailureHandler((error) => {
            creatingAccount.value = false;
            console.error('Failed to create account:', error);
            alert('Error creating account.');
          })
          .addUser({
            email: currentUserEmail.value,
            name: trimmedName,
            managerId: createAccountForm.value.managerId,
          });
      };

      const priorityOptions = ['High', 'Medium', 'Low'];
      const legacyPriorityByScore = {
        5: 'High',
        4: 'High',
        3: 'Medium',
        2: 'Low',
        1: 'Low'
      };
      const priorityRank = {
        High: 3,
        Medium: 2,
        Low: 1
      };

      const normalizePriority = (priorityValue) => {
        if (priorityValue === null || priorityValue === undefined || priorityValue === '') return '';
        if (typeof priorityValue === 'number' && Number.isInteger(priorityValue)) {
          return legacyPriorityByScore[priorityValue] || '';
        }

        const trimmedValue = priorityValue.toString().trim();
        if (!trimmedValue) return '';

        if (priorityRank[trimmedValue]) return trimmedValue;

        const numericPriority = Number(trimmedValue);
        if (Number.isInteger(numericPriority)) {
          return legacyPriorityByScore[numericPriority] || '';
        }

        return '';
      };

      const getPriorityRank = (priorityValue) => priorityRank[normalizePriority(priorityValue)] || Number.NEGATIVE_INFINITY;

      const compareTasksByPriority = (leftTask, rightTask) => {
        const normalizedLeftPriority = getPriorityRank(leftTask?.Priority);
        const normalizedRightPriority = getPriorityRank(rightTask?.Priority);
        if (normalizedLeftPriority !== normalizedRightPriority) {
          return normalizedRightPriority - normalizedLeftPriority;
        }

      function parseAsLocalDate(dateValue) {
        if (!dateValue) return new Date('');

        if (dateValue instanceof Date) {
          if (Number.isNaN(dateValue.getTime())) return new Date('');
          return new Date(dateValue.getFullYear(), dateValue.getMonth(), dateValue.getDate());
        }

        const trimmedValue = dateValue.toString().trim();
        if (!trimmedValue) return new Date('');

        const dateOnlyMatch = trimmedValue.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (dateOnlyMatch) {
          const year = Number(dateOnlyMatch[1]);
          const month = Number(dateOnlyMatch[2]);
          const day = Number(dateOnlyMatch[3]);
          return new Date(year, month - 1, day);
        }

        const parsedDate = new Date(trimmedValue);
        if (Number.isNaN(parsedDate.getTime())) return new Date('');
        return new Date(parsedDate.getFullYear(), parsedDate.getMonth(), parsedDate.getDate());
      }

      const statusColor = (status) => {

      const getInitials = (name) => {

      const formatDate = (dateString) => {
        if (!dateString) return '—';
        const date = parseAsLocalDate(dateString);

      };

      const formatDateForInput = (dateString) => {
        if (!dateString) return '';
        const date = parseAsLocalDate(dateString);
        if (Number.isNaN(date.getTime())) return '';
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;

      const calendarMonthOffset = ref(0);

      const today = computed(() => {

        const baseDate = today.value;
        return new Date(baseDate.getFullYear(), baseDate.getMonth() + calendarMonthOffset.value, 1);
      });

      const calendarMonthLabel = computed(() => {

      });

      const calendarWeekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      const toCalendarDateKey = (dateValue) => {
        const parsedDate = parseAsLocalDate(dateValue);

        return formatDateForInput(parsedDate);
      };

      const calendarTaskEntries = computed(() => {

      const calendarTasksByDate = computed(() => {
        const byDate = new Map();
        calendarTaskEntries.value.forEach((entry) => {
          if (!byDate.has(entry.dateKey)) byDate.set(entry.dateKey, []);
          byDate.get(entry.dateKey).push(entry);
        });
        return byDate;
      });

      const calendarDays = computed(() => {
        const monthStart = calendarMonthStart.value;
        const firstDayOfMonth = monthStart.getDay();
        const gridStartDate = new Date(monthStart);
        gridStartDate.setDate(monthStart.getDate() - firstDayOfMonth);

        return Array.from({ length: 42 }, (_, index) => {
          const cellDate = new Date(gridStartDate);
          cellDate.setDate(gridStartDate.getDate() + index);

          const dateKey = toCalendarDateKey(cellDate);
          const normalizedToday = today.value;

          return {
            dateKey,
            dayOfMonth: cellDate.getDate(),
            inCurrentMonth: cellDate.getMonth() === monthStart.getMonth(),
            isToday:
              cellDate.getFullYear() === normalizedToday.getFullYear() &&
              cellDate.getMonth() === normalizedToday.getMonth() &&
              cellDate.getDate() === normalizedToday.getDate()
          };
        });
      });

      const getCalendarTaskEntries = (dateKey) => {

      const goToPreviousCalendarMonth = () => {
        calendarMonthOffset.value -= 1;
      };

      const goToNextCalendarMonth = () => {

      const isPastDueDate = (dueDateValue) => {
        if (!dueDateValue) return false;
        const dueDate = parseAsLocalDate(dueDateValue);
        if (Number.isNaN(dueDate.getTime())) return false;
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        return dueDate.getTime() < startOfToday.getTime();

      const makeClientId = (prefix) => `${prefix}-local-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

            comments.value = comments.value.filter((comment) => !idsMatch(comment.Topic_ID, normalizedTopicId));

      const addComment = () => {
        if (!activeCommentTaskId.value) return;

        if (!trimmedContent) {
          alert('Please enter a comment before posting.');

        const topicId = activeCommentTaskId.value;

          Topic_ID: topicId,
          Commenter_ID: currentUser.value?.User_ID || '',
          Timestamp: new Date().toISOString(),
          Content: trimmedContent,
          _syncing: true
        };

        creatingComment.value = true;
        comments.value.push(optimisticComment);

        google.script.run
          .withSuccessHandler((response) => {
            creatingComment.value = false;

              commentDraft.value = trimmedContent;
              alert(result?.error || 'Failed to add comment.');
              return;

            const commentIndex = comments.value.findIndex((comment) => idsMatch(comment.Comment_ID, tempCommentId));
            if (commentIndex >= 0) {

      const updateMentionSuggestions = (event) => {
        const cursorIndex = event?.target?.selectionStart ?? commentDraft.value.length;

        const beforeCursor = commentDraft.value.slice(0, cursorIndex);
        const match = beforeCursor.match(/(^|\s)@([a-zA-Z0-9._-]*)$/);
        if (!match) {
          showMentionSuggestions.value = false;
          mentionQuery.value = '';
          mentionStartIndex.value = -1;
          return;
        }

        mentionQuery.value = (match[2] || '').toLowerCase();
        mentionStartIndex.value = cursorIndex - mentionQuery.value.length - 1;
        showMentionSuggestions.value = true;
      };

      const applyMentionSuggestion = (handle) => {
        if (!handle || mentionStartIndex.value < 0) return;
        const cursorIndex = mentionCursorIndex.value >= 0 ? mentionCursorIndex.value : commentDraft.value.length;
        const before = commentDraft.value.slice(0, mentionStartIndex.value);
        const after = commentDraft.value.slice(cursorIndex);
        commentDraft.value = `${before}@${handle} ${after}`;
        showMentionSuggestions.value = false;

                tasks.value.push(result.task);

              if (taskDetailsForm.value && idsMatch(taskDetailsForm.value.taskId, result.task.Task_ID)) {
                taskDetailsForm.value = buildTaskDetailsForm(result.task);

            }

          .withFailureHandler((error) => {
            updatingTaskStatusIds.value = updatingTaskStatusIds.value.filter((id) => !idsMatch(id, taskId));
            if (previousTask && taskIndex >= 0) tasks.value.splice(taskIndex, 1, previousTask);
            if (taskDetailsForm.value && idsMatch(taskDetailsForm.value.taskId, taskId)) {
              taskDetailsForm.value = previousTask ? buildTaskDetailsForm(previousTask) : taskDetailsForm.value;

      const saveTaskEdits = () => {

        if (!Array.isArray(taskDetailsForm.value.assigneeIds) || taskDetailsForm.value.assigneeIds.length === 0) {
          alert('Please assign at least one person to this task.');
          return;
        }

        const taskId = taskDetailsForm.value.taskId;
        const taskIndex = tasks.value.findIndex((t) => idsMatch(t.Task_ID, taskId));
        const previousTask = taskIndex >= 0 ? { ...tasks.value[taskIndex] } : null;
        const previousAssignments = assignments.value.slice();
        const optimisticTask = {
          ...(previousTask || {}),
          Task_ID: taskId,
          Project_ID: taskDetailsForm.value.projectId,
          Task_Title: trimmedTitle,
          Due_Date: taskDetailsForm.value.dueDate,
          Status: taskDetailsForm.value.status,
          Description: taskDetailsForm.value.description,
          Priority: taskDetailsForm.value.priority,
          _syncing: true
        };
        const optimisticAssignments = taskDetailsForm.value.assigneeIds.map((assigneeId) => ({
          Assignment_ID: taskId,
          Assignee_ID: assigneeId,
          _syncing: true
        }));

        savingTask.value = true;
        if (taskIndex >= 0) tasks.value.splice(taskIndex, 1, optimisticTask);
        assignments.value = assignments.value.filter((a) => !idsMatch(a.Assignment_ID, taskId));
        assignments.value.push(...optimisticAssignments);

        google.script.run
          .withSuccessHandler((response) => {
            savingTask.value = false;

            const result = parseRunResponse(response);
            if (!result || !result.success) {
              if (previousTask && taskIndex >= 0) tasks.value.splice(taskIndex, 1, previousTask);
              assignments.value = previousAssignments;

              return;

            const updatedTask = result.task;
            const updatedTaskIndex = tasks.value.findIndex((t) => idsMatch(t.Task_ID, updatedTask.Task_ID));
            if (updatedTaskIndex >= 0) {
              tasks.value.splice(updatedTaskIndex, 1, updatedTask);
            }

            assignments.value = assignments.value.filter((a) => !idsMatch(a.Assignment_ID, updatedTask.Task_ID));
            if (Array.isArray(result.assignments) && result.assignments.length > 0) {

            console.error('Failed to update task:', error);
            alert('Error updating task.');

      const deleteTask = () => {
        if (!taskDetailsForm.value?.taskId || savingTask.value || deletingTask.value) return;

        const confirmed = confirm('Are you sure you want to delete this task? This action cannot be undone.');
        if (!confirmed) return;

        const taskId = taskDetailsForm.value.taskId;
        const previousTasks = tasks.value.slice();
        const previousAssignments = assignments.value.slice();
        deletingTask.value = true;
        tasks.value = tasks.value.filter((task) => !idsMatch(task.Task_ID, taskId));
        assignments.value = assignments.value.filter((assignment) => !idsMatch(assignment.Assignment_ID, taskId));
        closeTaskInfo();

        google.script.run
          .withSuccessHandler((response) => {
            deletingTask.value = false;
            const result = parseRunResponse(response);
            if (!result || !result.success) {
              tasks.value = previousTasks;
              assignments.value = previousAssignments;
              alert(result?.error || 'Failed to delete task.');
            }
          })
          .withFailureHandler((error) => {
            deletingTask.value = false;
            tasks.value = previousTasks;
            assignments.value = previousAssignments;
            console.error('Failed to delete task:', error);
            alert('Error deleting task.');
          })
          .deleteTask(taskId);
      };

      const completeTask = () => {
        if (!taskDetailsForm.value?.taskId || savingTask.value || deletingTask.value || completingTask.value) return;

        const taskId = taskDetailsForm.value.taskId;
        const taskIndex = tasks.value.findIndex((task) => idsMatch(task.Task_ID, taskId));
        const previousTask = taskIndex >= 0 ? { ...tasks.value[taskIndex] } : null;
        const optimisticTask = {
          ...(previousTask || {}),
          Task_ID: taskId,
          Status: 'Completed',
          Completed_By: currentUser.value?.User_ID || '',
          Completed_At: new Date().toISOString(),
          _syncing: true
        };

        completingTask.value = true;
        if (taskIndex >= 0) tasks.value.splice(taskIndex, 1, optimisticTask);
        taskDetailsForm.value = buildTaskDetailsForm(optimisticTask);

        google.script.run
          .withSuccessHandler((response) => {
            completingTask.value = false;

            const result = parseRunResponse(response);
            if (!result || !result.success) {
              if (previousTask && taskIndex >= 0) tasks.value.splice(taskIndex, 1, previousTask);
              taskDetailsForm.value = previousTask ? buildTaskDetailsForm(previousTask) : taskDetailsForm.value;
              alert(result?.error || 'Failed to complete task.');
              return;
            }

            if (result.task) {
              const updatedIndex = tasks.value.findIndex((task) => idsMatch(task.Task_ID, result.task.Task_ID));
              if (updatedIndex >= 0) {
                tasks.value.splice(updatedIndex, 1, result.task);
              } else {
                tasks.value.push(result.task);
              }
              taskDetailsForm.value = buildTaskDetailsForm(result.task);
            }
          })
          .withFailureHandler((error) => {
            completingTask.value = false;
            if (previousTask && taskIndex >= 0) tasks.value.splice(taskIndex, 1, previousTask);
            taskDetailsForm.value = previousTask ? buildTaskDetailsForm(previousTask) : taskDetailsForm.value;
            console.error('Failed to complete task:', error);
            alert('Error completing task.');
          })
          .completeTask(taskId);
      };

      const deleteTaskPermanently = (task) => {
        const taskId = normalizeId(task?.Task_ID);
        if (!taskId || permanentlyDeletingTaskIds.value.includes(taskId)) return;

        const confirmed = confirm('Delete this completed task permanently? This action cannot be undone.');
        if (!confirmed) return;

        permanentlyDeletingTaskIds.value.push(taskId);
        google.script.run
          .withSuccessHandler((response) => {
            permanentlyDeletingTaskIds.value = permanentlyDeletingTaskIds.value.filter((id) => !idsMatch(id, taskId));
            const result = typeof response === 'string' ? JSON.parse(response) : response;
            if (!result || !result.success) {
              alert(result?.error || 'Failed to delete task.');
              return;

            tasks.value = tasks.value.filter((item) => !idsMatch(item.Task_ID, taskId));
            assignments.value = assignments.value.filter((assignment) => !idsMatch(assignment.Assignment_ID, taskId));

          .withFailureHandler((error) => {
            permanentlyDeletingTaskIds.value = permanentlyDeletingTaskIds.value.filter((id) => !idsMatch(id, taskId));
