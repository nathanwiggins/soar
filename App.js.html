<script>
  const { createApp, ref, computed, watch, onMounted, nextTick } = Vue;

  const app = createApp({
    setup() {
      const loading = ref(true);
      const currentUserEmail = ref('');
      const showCreateAccountModal = ref(false);
      const creatingAccount = ref(false);
      const createAccountForm = ref({
        name: '',
        managerId: '',
      });

      const isDarkMode = ref(false);
      const isUserMenuOpen = ref(false);
      const showProfileModal = ref(false);
      const showSettingsModal = ref(false);
      const savedFontScale = ref(100);
      const savingSettings = ref(false);
      const isEditingProfile = ref(false);
      const savingProfile = ref(false);
      const profileForm = ref({
        name: '',
        email: '',
      });
      const settingsForm = ref({
        fontScale: 100,
        notifications: {
          taskAssignments: true,
          commentsAndMentions: true,
          dueDateReminders: true,
          taskCompletion: true,
          weeklyDigest: false,
          agendaShares: true,
          ticketFollowUp: true
        }
      });

      const isChatOpen = ref(false);
      const isChatLoading = ref(false);

      const isTodoOpen = ref(false);
      const todoItems = ref([]);
      const todoNewItemText = ref('');
      const todoLoaded = ref(false);
      const todoSaving = ref(false);
      const chatInput = ref('');
      const CHAT_HISTORY_KEY = 'soar_chat_history_v1';
      const CHAT_WELCOME_MESSAGE = { role: 'assistant', content: 'Hi there! I am your SOAR AI Assistant. How can I help you use SOAR today?' };

      const loadPersistedChat = () => {
        try {
          const raw = localStorage.getItem(CHAT_HISTORY_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          const today = new Date().toISOString().slice(0, 10);
          if (parsed.date !== today) return null;
          return parsed.messages;
        } catch (e) {
          return null;
        }
      };

      const chatMessages = ref(loadPersistedChat() || [CHAT_WELCOME_MESSAGE]);
      const chatScrollContainer = ref(null);

      const chatOffsetX = ref(0);
      const chatOffsetY = ref(0);
      const isDraggingChat = ref(false);
      let dragStartX = 0;
      let dragStartY = 0;
      let initialOffsetX = 0;
      let initialOffsetY = 0;

      const startChatDrag = (event) => {
        isDraggingChat.value = true;
        dragStartX = event.clientX;
        dragStartY = event.clientY;
        initialOffsetX = chatOffsetX.value;
        initialOffsetY = chatOffsetY.value;
        
        document.addEventListener('pointermove', onChatDrag);
        document.addEventListener('pointerup', stopChatDrag);
        document.body.style.userSelect = 'none';
      };

      const onChatDrag = (event) => {
        if (!isDraggingChat.value) return;
        chatOffsetX.value = initialOffsetX + (event.clientX - dragStartX);
        chatOffsetY.value = initialOffsetY + (event.clientY - dragStartY);
      };

      const stopChatDrag = () => {
        isDraggingChat.value = false;
        document.removeEventListener('pointermove', onChatDrag);
        document.removeEventListener('pointerup', stopChatDrag);
        document.body.style.userSelect = ''; // Restore text highlighting
      };

      const users = ref([]);
      const projects = ref([]);
      const tasks = ref([]);
      const subtasks = ref([]);
      const agendas = ref([]);
      const agendaShares = ref([]);
      const agendaSessions = ref([]);
      const activeSession = ref(null);
      const activeSessionIndex = ref(0);
      const savingSession = ref(false);
      const showAgendaModal = ref(false);
      const activeAgenda = ref(null);
      const activeAgendaShares = ref([]);
      const savingAgenda = ref(false);
      const showNewSessionPrompt = ref(false);
      const newSubtaskTitle = ref('');
      const assignments = ref([]);
      const comments = ref([]);
      const dataVersionHash = ref('');
      const loadedCommentTopicIds = ref([]);
      const loadingCommentTopicIds = ref([]);
      const commentDraft = ref('');
      const creatingComment = ref(false);
      const resolvingCommentIds = ref([]);
      const deletingCommentIds = ref([]);
      const showCommentModal = ref(false);
      const commentModalTask = ref(null);
      const activeCommentTaskId = ref('');
      const showMentionSuggestions = ref(false);
      const mentionQuery = ref('');
      const mentionStartIndex = ref(-1);
      const mentionCursorIndex = ref(-1);
      const quickCommentTextarea = ref(null);
      const showAllWorkItems = ref(false);
      const currentTab = ref('project-board');
      const isSidebarVisible = ref(true);
      const kanbanScrollContainer = ref(null);
      const calendarScrollContainer = ref(null);
      const calendarViewMode = ref(localStorage.getItem('soar_calendar_view') || 'month');
      const showSupervisorUserDropdown = ref(false);
      const selectedSupervisorUserIds = ref([]);
      const INITIAL_PAYLOAD_CACHE_KEY = 'soar_initial_payload_v4';
      const LOGO_CACHE_KEY = 'soar_processed_logo_v1';
      const memoCache = new Map();

      const getItemSignature = (item, idKey, fields) => [
        item?.[idKey] || '',
        ...fields.map((field) => item?.[field] || '')
      ].join('~');

      const getCollectionSignature = (items, idKey, fields = []) => {
        if (!Array.isArray(items)) return '0';
        return `${items.length}:${items.map((item) => getItemSignature(item, idKey, fields)).join('|')}`;
      };

      const memoizeBySignature = (cacheKey, signature, factory) => {
        const cached = memoCache.get(cacheKey);
        if (cached && cached.signature === signature) return cached.value;
        const value = factory();
        memoCache.set(cacheKey, { signature, value });
        return value;
      };

      const taskDefaultStatus = 'Not Started';
      const taskCompleteStatus = 'Complete';
      const taskStatusOptions = [
        taskDefaultStatus,
        'Upcoming',
        'Review',
        'In Progress',
        'Ongoing',
        'On Hold',
        'Cancelled',
        'Closeout',
        taskCompleteStatus
      ];
      const isCompleteStatus = (status) => ['Complete', 'Completed'].includes((status || '').toString().trim());
      const normalizeTaskStatusForDisplay = (status) => {
        const normalizedStatus = (status || '').toString().trim();
        if (normalizedStatus === 'Not Started') return taskDefaultStatus;
        if (isCompleteStatus(normalizedStatus)) return taskCompleteStatus;
        if (taskStatusOptions.includes(normalizedStatus)) return normalizedStatus;
        return taskDefaultStatus;
      };
      const buildProjectColorScheme = (label, deep, light, darkLight, border) => ({ label, deep, light, darkLight, border });
      const defaultProjectColorScheme = 'suu_red';
      const projectColorSchemes = {
        suu_red: buildProjectColorScheme('SUU Red (Default)', '#DB0000', '#FEE2E2', 'rgba(127, 29, 29, 0.28)', '#FECACA'),
        sunset_orange: buildProjectColorScheme('Sunset Orange', '#F97316', '#FFEDD5', 'rgba(124, 45, 18, 0.28)', '#FED7AA'),
        amber_gold: buildProjectColorScheme('Amber Gold', '#F59E0B', '#FEF3C7', 'rgba(146, 64, 14, 0.28)', '#FDE68A'),
        emerald_green: buildProjectColorScheme('Emerald Green', '#10B981', '#D1FAE5', 'rgba(6, 95, 70, 0.28)', '#A7F3D0'),
        ocean_teal: buildProjectColorScheme('Ocean Teal', '#14B8A6', '#CCFBF1', 'rgba(15, 118, 110, 0.28)', '#99F6E4'),
        sky_blue: buildProjectColorScheme('Sky Blue', '#0EA5E9', '#E0F2FE', 'rgba(3, 105, 161, 0.28)', '#BAE6FD'),
        deep_indigo: buildProjectColorScheme('Deep Indigo', '#4F46E5', '#E0E7FF', 'rgba(67, 56, 202, 0.28)', '#C7D2FE'),
        soft_violet: buildProjectColorScheme('Soft Violet', '#7C3AED', '#EDE9FE', 'rgba(91, 33, 182, 0.28)', '#DDD6FE'),
        rose_pink: buildProjectColorScheme('Rose Pink', '#EC4899', '#FCE7F3', 'rgba(157, 23, 77, 0.28)', '#FBCFE8'),
        pearl_white: buildProjectColorScheme('Pearl White', '#6B7280', '#FFFFFF', 'rgba(75, 85, 99, 0.28)', '#E5E7EB')
      };
      const projectColorSchemeOptions = Object.entries(projectColorSchemes).map(([value, scheme]) => ({
        value,
        label: scheme.label,
        deep: scheme.deep,
        light: scheme.light
      }));

      const showAddTaskModal = ref(false);
      const showAddProjectModal = ref(false);
      const showAddAgendaModal = ref(false);
      const selectedProject = ref(null);
      const creatingTask = ref(false);
      const creatingProject = ref(false);
      const creatingAgenda = ref(false);
      const newAgendaForm = ref({ title: '', description: '' });
      const showAssigneeDropdown = ref(false);
      const newDraftSubtask = ref('');
      const newTaskForm = ref({
        taskTitle: '',
        dueDate: '',
        description: '',
        priority: '',
        assigneeIds: [],
        subtasks: []
      });
      const newProjectForm = ref({
        projectTitle: '',
        dueDate: '',
        description: '',
        status: 'Not Started',
        colorScheme: defaultProjectColorScheme
      });

      const showTaskDetailsModal = ref(false);
      const taskDetailsForm = ref(null);
      const showTaskDetailsAssigneeDropdown = ref(false);
      const isEditingTask = ref(false);
      const savingTask = ref(false);
      const deletingTask = ref(false);
      const completingTask = ref(false);
      const updatingTaskStatusIds = ref([]);
      const permanentlyDeletingTaskIds = ref([]);
      const showProjectDetailsModal = ref(false);
      const projectDetailsForm = ref(null);
      const deletingProject = ref(false);
      const isEditingProject = ref(false);
      const savingProject = ref(false);

      const currentUser = computed(() => {
        return userStats.value.usersByEmail.get(normalizeEmail(currentUserEmail.value)) || {
          Email: currentUserEmail.value,
          Name: 'Unknown User'
        };
      });

      const assigneeSummary = computed(() => {
        const count = newTaskForm.value.assigneeIds.length;
        if (count === 0) return 'Select assignees';
        if (count === 1) {
          const selectedUser = userStats.value.usersById.get(normalizeId(newTaskForm.value.assigneeIds[0]));
          return selectedUser ? selectedUser.Name : '1 assignee selected';
        }
        return `${count} assignees selected`;
      });

      const taskDetailsAssigneeSummary = computed(() => {
        const selectedIds = taskDetailsForm.value?.assigneeIds || [];
        if (selectedIds.length === 0) return 'Select assignees';
        if (selectedIds.length === 1) {
          const selectedUser = userStats.value.usersById.get(normalizeId(selectedIds[0]));
          return selectedUser ? selectedUser.Name : '1 assignee selected';
        }
        return `${selectedIds.length} assignees selected`;
      });

      const taskDetailsAssigneeUsers = computed(() => {
        const selectedIds = taskDetailsForm.value?.assigneeIds || [];
        return selectedIds
          .map((id) => getUserById(id))
          .filter(Boolean);
      });

      const projectDetailsCreator = computed(() => {
        if (!projectDetailsForm.value?.creatorId) return null;
        return getUserById(projectDetailsForm.value.creatorId);
      });

      const completedTaskByUser = computed(() => {
        if (!taskDetailsForm.value?.completedById) return null;
        return getUserById(taskDetailsForm.value.completedById);
      });

      const taskComments = computed(() => {
        const topicId = activeCommentTaskId.value;
        if (!topicId) return [];

        return comments.value
          .filter((comment) => !isResolvedComment(comment) && idsMatch(getCommentTopicId(comment), topicId))
          .slice()
          .sort((left, right) => {
            const leftTime = new Date(left.Timestamp || 0).getTime();
            const rightTime = new Date(right.Timestamp || 0).getTime();
            return rightTime - leftTime;
          });
      });

      const mentionableUsers = computed(() => {
        const byHandle = new Map();
        users.value.forEach((user) => {
          const emailLocalPart = normalizeEmail(user?.Email).split('@')[0];
          const fallbackHandle = (user?.Name || '')
            .toString()
            .trim()
            .toLowerCase()
            .replace(/\s+/g, '.')
            .replace(/[^a-z0-9._-]/g, '');
          const handle = emailLocalPart || fallbackHandle;
          if (!handle) return;

          if (!byHandle.has(handle)) {
            byHandle.set(handle, {
              handle,
              userId: user.User_ID,
              name: user.Name || '',
              email: user.Email || ''
            });
          }
        });

        return Array.from(byHandle.values()).sort((a, b) => a.handle.localeCompare(b.handle));
      });

      const filteredMentionSuggestions = computed(() => {
        if (!showMentionSuggestions.value) return [];
        const query = mentionQuery.value.toLowerCase();
        return mentionableUsers.value
          .filter((entry) => !query || entry.handle.toLowerCase().startsWith(query))
          .slice(0, 6);
      });

      const managerOptions = computed(() => {
        const currentEmail = normalizeEmail(currentUserEmail.value);
        return users.value
          .filter((u) => normalizeEmail(u?.Email) !== currentEmail)
          .sort((a, b) => (a?.Name || '').localeCompare(b?.Name || ''));
      });

      const currentUserId = computed(() => {
        return currentUser.value?.User_ID ? currentUser.value.User_ID.toString().trim() : '';
      });

      const userStats = computed(() => {
        const signature = [
          getCollectionSignature(users.value, 'User_ID', ['Email', 'Name', 'Manager_ID', 'Profile_Pic_Url']),
          getCollectionSignature(assignments.value, 'Assignment_ID', ['Assignee_ID'])
        ].join('::');

        return memoizeBySignature('userStats', signature, () => {
          const usersById = new Map();
          const usersByEmail = new Map();
          const directReportsByManagerId = new Map();
          users.value.forEach((user) => {
            const userId = normalizeId(user?.User_ID);
            const userEmail = normalizeEmail(user?.Email);
            const managerId = normalizeId(user?.Manager_ID);
            if (userId) usersById.set(userId, user);
            if (userEmail) usersByEmail.set(userEmail, user);
            if (managerId && userId) {
              if (!directReportsByManagerId.has(managerId)) directReportsByManagerId.set(managerId, []);
              directReportsByManagerId.get(managerId).push(user);
            }
          });

          const assignmentsByUserId = new Map();
          const assigneesByTaskId = new Map();
          assignments.value.forEach((assignment) => {
            const assignmentId = normalizeId(assignment?.Assignment_ID);
            const assigneeId = normalizeId(assignment?.Assignee_ID);
            if (!assignmentId || !assigneeId) return;

            if (!assignmentsByUserId.has(assigneeId)) assignmentsByUserId.set(assigneeId, new Set());
            assignmentsByUserId.get(assigneeId).add(assignmentId);

            if (!assigneesByTaskId.has(assignmentId)) assigneesByTaskId.set(assignmentId, []);
            const user = usersById.get(assigneeId);
            if (user) assigneesByTaskId.get(assignmentId).push(user);
          });

          directReportsByManagerId.forEach((reportUsers) => {
            reportUsers.sort((a, b) => (a?.Name || '').localeCompare(b?.Name || ''));
          });

          return { usersById, usersByEmail, directReportsByManagerId, assignmentsByUserId, assigneesByTaskId };
        });
      });

      const projectsById = computed(() => {
        const map = new Map();
        projects.value.forEach((p) => {
          const id = normalizeId(p?.Project_ID);
          if (id) map.set(id, p);
        });
        return map;
      });

      const tasksById = computed(() => {
        const map = new Map();
        tasks.value.forEach((t) => {
          const id = normalizeId(t?.Task_ID);
          if (id) map.set(id, t);
        });
        return map;
      });

      const assignedEntityIdsForCurrentUser = computed(() => {
        const userId = currentUserId.value;
        if (!userId) return new Set();
        return userStats.value.assignmentsByUserId.get(userId) || new Set();
      });

      const filteredTasks = computed(() => {
        const signature = [
          getCollectionSignature(tasks.value, 'Task_ID', ['Project_ID', 'Status', 'Due_Date', 'Priority', 'Task_Title', 'Description', '_syncing']),
          getCollectionSignature(assignments.value, 'Assignment_ID', ['Assignee_ID']),
          currentUserId.value,
          showAllWorkItems.value ? 'all' : 'assigned'
        ].join('::');

        return memoizeBySignature('filteredTasks', signature, () => {
          if (showAllWorkItems.value) return tasks.value;
          const assignedIds = assignedEntityIdsForCurrentUser.value;
          return tasks.value.filter((task) => {
            if (isCompleteStatus(task?.Status)) return false;
            return assignedIds.has(normalizeId(task?.Task_ID));
          });
        });
      });

      const visibleTasks = filteredTasks;

      const pastAssignments = computed(() => {
        const signature = [
          getCollectionSignature(tasks.value, 'Task_ID', ['Status', 'Due_Date', 'Task_Title', 'Description', 'Priority']),
          currentUserId.value,
          getCollectionSignature(assignments.value, 'Assignment_ID', ['Assignee_ID'])
        ].join('::');
        return memoizeBySignature('pastAssignments', signature, () => {
          const assignedIds = assignedEntityIdsForCurrentUser.value;
          return tasks.value
            .filter((task) => isCompleteStatus(task?.Status) && assignedIds.has(normalizeId(task?.Task_ID)))
            .slice()
            .sort((left, right) => {
              const leftTime = parseAsLocalDate(left?.Due_Date || 0).getTime();
              const rightTime = parseAsLocalDate(right?.Due_Date || 0).getTime();
              return rightTime - leftTime;
            });
        });
      });

      const visibleProjects = computed(() => {
        const signature = [
          getCollectionSignature(projects.value, 'Project_ID', ['Project_ID', 'Project_Title', 'Description', 'Status', 'Due_Date', 'Color_Scheme']),
          getCollectionSignature(visibleTasks.value, 'Task_ID', ['Project_ID']),
          currentUserId.value,
          showAllWorkItems.value ? '1' : '0'
        ].join('::');
        return memoizeBySignature('visibleProjects', signature, () => {
          if (showAllWorkItems.value) return projects.value;
          const assignedIds = assignedEntityIdsForCurrentUser.value;
          const visibleProjectIds = new Set(
            visibleTasks.value
              .map((task) => normalizeId(task?.Project_ID))
              .filter(Boolean)
          );

          return projects.value.filter((project) => {
            const projectId = normalizeId(project?.Project_ID);
            return assignedIds.has(projectId) || visibleProjectIds.has(projectId);
          });
        });
      });

      const myAgendas = computed(() => {
        return agendas.value.filter(a => idsMatch(a.Creator_ID, currentUserId.value));
      });

      const sharedAgendas = computed(() => {
        const mySharedAgendaIds = new Set(
          agendaShares.value
            .filter(share => idsMatch(share.User_ID, currentUserId.value))
            .map(share => share.Agenda_ID)
        );
        return agendas.value.filter(a => mySharedAgendaIds.has(a.Agenda_ID));
      });

      const directReportUsers = computed(() => {
        const managerId = currentUserId.value;
        if (!managerId) return [];
        return userStats.value.directReportsByManagerId.get(managerId) || [];
      });

      const assignableUsers = computed(() => {
        const signature = [
          currentUserId.value,
          getCollectionSignature(users.value, 'User_ID', ['Manager_ID'])
        ].join('::');
        return memoizeBySignature('assignableUsers', signature, () => {
          const normalizedCurrentUserId = normalizeId(currentUserId.value);
          if (!normalizedCurrentUserId) return [];

          const assignableIdSet = new Set([normalizedCurrentUserId]);
          const queue = [normalizedCurrentUserId];
          while (queue.length > 0) {
            const managerId = queue.shift();
            const directReports = userStats.value.directReportsByManagerId.get(managerId) || [];
            directReports.forEach((reportUser) => {
              const reportId = normalizeId(reportUser?.User_ID);
              if (reportId && !assignableIdSet.has(reportId)) {
                assignableIdSet.add(reportId);
                queue.push(reportId);
              }
            });
          }

          return Array.from(assignableIdSet)
            .map((userId) => userStats.value.usersById.get(userId))
            .filter(Boolean)
            .sort((a, b) => (a?.Name || '').localeCompare(b?.Name || ''));
        });
      });

      const supervisorUserSummary = computed(() => {
        const count = selectedSupervisorUserIds.value.length;
        if (count === 0) return 'Select team members';
        if (count === 1) {
          const selectedUser = userStats.value.usersById.get(normalizeId(selectedSupervisorUserIds.value[0]));
          return selectedUser?.Name || '1 team member selected';
        }
        return `${count} team members selected`;
      });

      const assignedEntityIdsForSelectedSupervisorUsers = computed(() => {
        if (selectedSupervisorUserIds.value.length === 0) return new Set();
        const selectedUserIdSet = new Set(selectedSupervisorUserIds.value.map((id) => normalizeId(id)).filter(Boolean));
        const ids = new Set();
        selectedUserIdSet.forEach((userId) => {
          const assignmentIds = userStats.value.assignmentsByUserId.get(userId);
          if (!assignmentIds) return;
          assignmentIds.forEach((assignmentId) => ids.add(assignmentId));
        });
        return ids;
      });

      const supervisorVisibleTasks = computed(() => {
        const signature = [
          getCollectionSignature(tasks.value, 'Task_ID', ['Status', 'Project_ID', 'Task_Title', 'Due_Date', 'Priority', 'Description']),
          selectedSupervisorUserIds.value.slice().sort().join(','),
          getCollectionSignature(assignments.value, 'Assignment_ID', ['Assignee_ID'])
        ].join('::');
        return memoizeBySignature('supervisorVisibleTasks', signature, () => {
          const assignedIds = assignedEntityIdsForSelectedSupervisorUsers.value;
          return tasks.value.filter((task) => {
            if (isCompleteStatus(task?.Status)) return false;
            return assignedIds.has(normalizeId(task?.Task_ID));
          });
        });
      });

      const supervisorVisibleProjects = computed(() => {
        const assignedIds = assignedEntityIdsForSelectedSupervisorUsers.value;
        const visibleProjectIds = new Set(
          supervisorVisibleTasks.value
            .map((task) => normalizeId(task?.Project_ID))
            .filter(Boolean)
        );

        return projects.value.filter((project) => {
          const projectId = normalizeId(project?.Project_ID);
          return assignedIds.has(projectId) || visibleProjectIds.has(projectId);
        });
      });

      const projectSummaries = computed(() => {
        const signature = [
          getCollectionSignature(projects.value, 'Project_ID', ['Project_Title', 'Description', 'Status', 'Due_Date', 'Color_Scheme']),
          getCollectionSignature(visibleTasks.value, 'Task_ID', ['Project_ID', 'Status', 'Due_Date', 'Priority', 'Task_Title', '_syncing']),
          getCollectionSignature(supervisorVisibleTasks.value, 'Task_ID', ['Project_ID', 'Status', 'Due_Date', 'Priority', 'Task_Title', '_syncing'])
        ].join('::');

        return memoizeBySignature('projectSummaries', signature, () => {
          const summaries = new Map();
          projects.value.forEach((project) => {
            const projectId = normalizeId(project?.Project_ID);
            if (!projectId) return;
            summaries.set(projectId, { project, tasks: [], supervisorTasks: [] });
          });

          visibleTasks.value.forEach((task) => {
            const projectId = normalizeId(task?.Project_ID);
            if (!summaries.has(projectId)) summaries.set(projectId, { project: null, tasks: [], supervisorTasks: [] });
            summaries.get(projectId).tasks.push(task);
          });

          supervisorVisibleTasks.value.forEach((task) => {
            const projectId = normalizeId(task?.Project_ID);
            if (!summaries.has(projectId)) summaries.set(projectId, { project: null, tasks: [], supervisorTasks: [] });
            summaries.get(projectId).supervisorTasks.push(task);
          });

          return summaries;
        });
      });

      const fontScaleLabel = computed(() => {
        const scale = Number(settingsForm.value?.fontScale) || 100;
        if (scale <= 90) return 'Smaller';
        if (scale >= 115) return 'Larger';
        return 'Default';
      });

      const readSessionStorage = (key) => {
        try {
          return sessionStorage.getItem(key);
        } catch (error) {
          console.warn(`Unable to read sessionStorage key ${key}:`, error);
          return null;
        }
      };

      const writeSessionStorage = (key, value) => {
        try {
          sessionStorage.setItem(key, value);
        } catch (error) {
          console.warn(`Unable to write sessionStorage key ${key}:`, error);
        }
      };

      const makeImageTransparent = (selector, cacheKey) => {
        const logo = document.querySelector(selector);
        if (!logo) return;

        const cachedLogo = readSessionStorage(cacheKey);
        if (cachedLogo) {
          logo.src = cachedLogo;
          return;
        }

        const processLogo = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = logo.naturalWidth;
            canvas.height = logo.naturalHeight;
            if (!canvas.width || !canvas.height) return;

            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            ctx.drawImage(logo, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;

            const corners = [
              [0, 0],
              [canvas.width - 1, 0],
              [0, canvas.height - 1],
              [canvas.width - 1, canvas.height - 1]
            ];

            let r = 0;
            let g = 0;
            let b = 0;

            corners.forEach(([x, y]) => {
              const index = (y * canvas.width + x) * 4;
              r += pixels[index];
              g += pixels[index + 1];
              b += pixels[index + 2];
            });

            const bgR = r / corners.length;
            const bgG = g / corners.length;
            const bgB = b / corners.length;
            const tolerance = 70;

            const isBgLike = (rVal, gVal, bVal) => {
              const dr = rVal - bgR;
              const dg = gVal - bgG;
              const db = bVal - bgB;
              const distance = Math.sqrt(dr * dr + dg * dg + db * db);
              const nearWhite = rVal > 225 && gVal > 225 && bVal > 225;
              return distance <= tolerance || nearWhite;
            };

            for (let i = 0; i < pixels.length; i += 4) {
              const rVal = pixels[i];
              const gVal = pixels[i + 1];
              const bVal = pixels[i + 2];
              if (isBgLike(rVal, gVal, bVal)) {
                pixels[i + 3] = 0;
              }
            }

            for (let i = 0; i < pixels.length; i += 4) {
              const alpha = pixels[i + 3];
              if (alpha === 0) continue;

              const rVal = pixels[i];
              const gVal = pixels[i + 1];
              const bVal = pixels[i + 2];

              if (rVal < 80 && gVal < 80 && bVal < 80) {
                pixels[i] = 219;
                pixels[i + 1] = 0;
                pixels[i + 2] = 0;
              }
            }

            ctx.putImageData(imageData, 0, 0);
            const processedLogo = canvas.toDataURL('image/png');
            logo.src = processedLogo;
            writeSessionStorage(cacheKey, processedLogo);
          } catch (error) {
            console.warn(`Unable to process transparency for ${selector}:`, error);
          }
        };

        const processWhenReady = () => {
          if (logo.complete) {
            processLogo();
          } else {
            logo.addEventListener('load', processLogo, { once: true });
          }

      const readInitialPayloadCache = () => {

            return null;

          return parsedCache;

          console.warn('Initial payload cache is corrupted; falling back to a full fetch.', error);

      const legacyPriorityByScore = {
        5: 'High',

      };
      const priorityRank = {
        High: 3,
        Medium: 2,
        Low: 1
      };

      const normalizePriority = (priorityValue) => {
        if (priorityValue === null || priorityValue === undefined || priorityValue === '') return '';
        if (typeof priorityValue === 'number' && Number.isInteger(priorityValue)) {
          return legacyPriorityByScore[priorityValue] || '';
        }

        const trimmedValue = priorityValue.toString().trim();
        if (!trimmedValue) return '';

        if (priorityRank[trimmedValue]) return trimmedValue;

        const numericPriority = Number(trimmedValue);
        if (Number.isInteger(numericPriority)) {
          return legacyPriorityByScore[numericPriority] || '';
        }

        return '';
      };

      const getPriorityRank = (priorityValue) => priorityRank[normalizePriority(priorityValue)] || Number.NEGATIVE_INFINITY;

      const compareTasksByPriority = (leftTask, rightTask) => {
        const normalizedLeftPriority = getPriorityRank(leftTask?.Priority);
        const normalizedRightPriority = getPriorityRank(rightTask?.Priority);
        if (normalizedLeftPriority !== normalizedRightPriority) {
          return normalizedRightPriority - normalizedLeftPriority;
        }

        const leftDueDate = parseAsLocalDate(leftTask?.Due_Date || 0).getTime();
        const rightDueDate = parseAsLocalDate(rightTask?.Due_Date || 0).getTime();
        return leftDueDate - rightDueDate;

      function parseAsLocalDate(dateValue) {
        if (!dateValue) return new Date('');

        if (dateValue instanceof Date) {
          if (Number.isNaN(dateValue.getTime())) return new Date('');
          return new Date(dateValue.getFullYear(), dateValue.getMonth(), dateValue.getDate());
        }

        const trimmedValue = dateValue.toString().trim();
        if (!trimmedValue) return new Date('');

        const dateOnlyMatch = trimmedValue.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (dateOnlyMatch) {
          const year = Number(dateOnlyMatch[1]);
          const month = Number(dateOnlyMatch[2]);
          const day = Number(dateOnlyMatch[3]);
          return new Date(year, month - 1, day);
        }

        const parsedDate = new Date(trimmedValue);
        if (Number.isNaN(parsedDate.getTime())) return new Date('');
        return new Date(parsedDate.getFullYear(), parsedDate.getMonth(), parsedDate.getDate());
      }

      const buildMonthDays = (monthStart) => {

      const stopCalendarAutoScroll = () => {

      const runCalendarAutoScroll = () => {
        if (!isCalendarAutoScrollActive.value) {

        const container = calendarScrollContainer.value;
        if (!container || typeof latestPointerY !== 'number') {
          calendarAutoScrollFrameId = requestAnimationFrame(runCalendarAutoScroll);
          return;
        }
        const rect = container.getBoundingClientRect();
        const edgeThreshold = 180;
        const maxStep = 12;
        let delta = 0;
        if (latestPointerY < rect.top + edgeThreshold) {
          const intensity = Math.min(1, (rect.top + edgeThreshold - latestPointerY) / edgeThreshold);
          delta = -Math.max(1, Math.round(maxStep * intensity));
        } else if (latestPointerY > rect.bottom - edgeThreshold) {
          const intensity = Math.min(1, (latestPointerY - (rect.bottom - edgeThreshold)) / edgeThreshold);
          delta = Math.max(1, Math.round(maxStep * intensity));
        }
        if (delta !== 0) container.scrollTop += delta;
        calendarAutoScrollFrameId = requestAnimationFrame(runCalendarAutoScroll);

      let calendarDueDateRequestCounter = 0;
      const latestCalendarDueDateRequests = {

        project: new Map()
      };

      const startCalendarDueDateRequest = (type, id) => {
        const requestId = ++calendarDueDateRequestCounter;
        latestCalendarDueDateRequests[type].set(id.toString(), requestId);
        return requestId;
      };

      const isLatestCalendarDueDateRequest = (type, id, requestId) => {
        return latestCalendarDueDateRequests[type].get(id.toString()) === requestId;
      };

      const finishCalendarDueDateRequest = (type, id, requestId) => {

      const onCalendarDragEnter = (dateKey) => {

      const onCalendarDrop = (event, dateKey) => {
        if (!event?.dataTransfer || !dateKey) return;
        let dragData = null;
        try {
          dragData = JSON.parse(event.dataTransfer.getData('application/json') || '{}');
        } catch (error) {
          return;
        }

        if (!dragData?.type || !dragData?.id) return;

        if (dragData.type === 'task') {
          const taskIndex = tasks.value.findIndex((task) => idsMatch(task?.Task_ID, dragData.id));
          if (taskIndex < 0) return;
          const originalDueDate = tasks.value[taskIndex].Due_Date || '';
          if (toCalendarDateKey(originalDueDate) === dateKey) return;

          calendarDateUndoStack.value.push({ type: 'task', id: dragData.id, originalDateKey: originalDueDate });
          const requestId = startCalendarDueDateRequest('task', dragData.id);
          tasks.value[taskIndex] = { ...tasks.value[taskIndex], Due_Date: dateKey };
          google.script.run
            .withSuccessHandler((response) => {
              if (!isLatestCalendarDueDateRequest('task', dragData.id, requestId)) return;

        }

      const runKanbanAutoScroll = () => {
        if (!isKanbanAutoScrollActive.value) {
          kanbanAutoScrollFrameId = null;
          return;
        }

        const container = kanbanScrollContainer.value;
        if (!container || typeof latestPointerX !== 'number') {
          kanbanAutoScrollFrameId = requestAnimationFrame(runKanbanAutoScroll);
          return;
        }

        const rect = container.getBoundingClientRect();
        const edgeThreshold = 180;
        const maxStep = 12;
        let delta = 0;

        if (latestPointerX < rect.left + edgeThreshold) {
          const intensity = Math.min(1, (rect.left + edgeThreshold - latestPointerX) / edgeThreshold);
          delta = -Math.max(1, Math.round(maxStep * intensity));
        } else if (latestPointerX > rect.right - edgeThreshold) {
          const intensity = Math.min(1, (latestPointerX - (rect.right - edgeThreshold)) / edgeThreshold);
          delta = Math.max(1, Math.round(maxStep * intensity));
        }

        if (delta !== 0) container.scrollLeft += delta;
        kanbanAutoScrollFrameId = requestAnimationFrame(runKanbanAutoScroll);
      };

        const duration = Math.max(1, overflow / 80);
        inner.style.transitionDelay = '0.25s';

        inner.style.transform = `translateX(-${overflow}px)`;

      const onTaskChange = (evt, targetProjectId) => {
        if (evt.added || evt.moved) {
           const element = evt.added ? evt.added.element : evt.moved.element;
           const newIndex = evt.added ? evt.added.newIndex : evt.moved.newIndex;

           if (evt.added) {
             const fromProjectId = draggingTaskSourceProjectId.value || normalizeId(element?.Project_ID);
             const revertMove = () => {
               memoCache.delete('filteredTasks');
               memoCache.delete('projectSummaries');

             if (!idsMatch(element?.Creator_ID, currentUserId.value)) {

             const targetProject = getProjectById(targetProjectId);
             if (!idsMatch(targetProject?.Creator_ID, currentUserId.value)) {
               revertMove();

             }
             if (fromProjectId && !idsMatch(fromProjectId, targetProjectId)) {
               const sourceProject = getProjectById(fromProjectId);
               if (!idsMatch(sourceProject?.Creator_ID, currentUserId.value)) {
                 revertMove();

             const fromProjectTaskIds = tasks.value

               .map(t => t.Task_ID);
             taskMoveUndoStack.value.push({ taskId: element.Task_ID, fromProjectId, fromProjectTaskIds });
           }

           const globalTaskIndex = tasks.value.findIndex(t => idsMatch(t.Task_ID, element.Task_ID));
           const globalTask = tasks.value[globalTaskIndex];
           tasks.value.splice(globalTaskIndex, 1);

           globalTask.Project_ID = targetProjectId;

           const currentProjectTasks = tasks.value.filter(t => idsMatch(t.Project_ID, targetProjectId));
           if (newIndex === 0) {
              if (currentProjectTasks.length > 0) {
                 const insertIndex = tasks.value.findIndex(t => idsMatch(t.Task_ID, currentProjectTasks[0].Task_ID));
                 tasks.value.splice(insertIndex, 0, globalTask);

                 const targetOrder = visibleProjectOrder.indexOf(normalizeId(targetProjectId));
                 let insertBeforeIndex = -1;
                 for (let i = 0; i < tasks.value.length; i++) {
                   const projOrder = visibleProjectOrder.indexOf(normalizeId(tasks.value[i].Project_ID));
                   if (projOrder > targetOrder) { insertBeforeIndex = i; break; }
                 }
                 if (insertBeforeIndex >= 0) {
                   tasks.value.splice(insertBeforeIndex, 0, globalTask);
                 } else {
                   tasks.value.push(globalTask);
                 }
              }
           } else {
              const precedingTask = currentProjectTasks[newIndex - 1];
              const insertIndex = tasks.value.findIndex(t => idsMatch(t.Task_ID, precedingTask.Task_ID));
              tasks.value.splice(insertIndex + 1, 0, globalTask);

           const allTaskIds = tasks.value.map(t => t.Task_ID);

      const createNewSession = (prefill) => {
        if (!activeAgenda.value) return;
        if (!idsMatch(activeAgenda.value.Creator_ID, currentUserId.value)) return;
        const sessions = getSessionsForAgenda(activeAgenda.value.Agenda_ID);
        let headers = [];
        if (prefill && sessions.length > 0) {
          try { headers = JSON.parse(sessions[0].Content_JSON || '[]'); } catch (e) { headers = []; }
          headers = JSON.parse(JSON.stringify(headers));
        }
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        activeSession.value = null;
        activeSessionIndex.value = -1;
        activeAgenda.value.headers = headers;
        activeAgenda.value.agendaDate = todayStr;
        showNewSessionPrompt.value = false;
      };

      const saveSession = () => {
        if (!activeAgenda.value) return;
        savingSession.value = true;

        const agendaId = activeAgenda.value.Agenda_ID;
        const sessionDate = activeAgenda.value.agendaDate || '';
        const contentStr = JSON.stringify(activeAgenda.value.headers);
        const title = activeAgenda.value.Title;
        const description = activeAgenda.value.Description || '';
        const sharesSnapshot = activeAgendaShares.value.slice();

        const agendaIdx = agendas.value.findIndex((a) => idsMatch(a.Agenda_ID, agendaId));
        const previousAgenda = agendaIdx >= 0 ? { ...agendas.value[agendaIdx] } : null;
        const previousShares = agendaShares.value.filter((s) => idsMatch(s.Agenda_ID, agendaId)).slice();

        const applyOptimisticAgenda = () => {
          const optimisticAgenda = { ...(previousAgenda || {}), Agenda_ID: agendaId, Title: title, Description: description, _syncing: true };
          if (agendaIdx >= 0) agendas.value.splice(agendaIdx, 1, optimisticAgenda);
          agendaShares.value = agendaShares.value.filter((s) => !idsMatch(s.Agenda_ID, agendaId));
          agendaShares.value.push(...sharesSnapshot.map((userId) => ({ Agenda_ID: agendaId, User_ID: userId })));
        };

        const rollbackAgenda = () => {
          if (previousAgenda) {
            const idx = agendas.value.findIndex((a) => idsMatch(a.Agenda_ID, agendaId));
            if (idx >= 0) agendas.value.splice(idx, 1, previousAgenda);
          }
          agendaShares.value = agendaShares.value.filter((s) => !idsMatch(s.Agenda_ID, agendaId));
          agendaShares.value.push(...previousShares);
        };

        const finalizeAgendaUpdate = () => {
          google.script.run
            .withSuccessHandler((agendaRes) => {
              savingSession.value = false;
              const agendaResult = parseRunResponse(agendaRes);
              if (agendaResult && agendaResult.success) {
                const idx = agendas.value.findIndex((a) => idsMatch(a.Agenda_ID, agendaResult.agenda.Agenda_ID));
                if (idx >= 0) agendas.value.splice(idx, 1, agendaResult.agenda);
                agendaShares.value = agendaShares.value.filter((s) => !idsMatch(s.Agenda_ID, agendaResult.agenda.Agenda_ID));
                agendaShares.value.push(...(agendaResult.shares || []));
              } else {
                showToast('Session saved but agenda details could not be updated.');
              }
            })
            .withFailureHandler(() => {
              savingSession.value = false;
              showToast('Session saved but agenda details could not be updated.');
            })
            .updateAgenda(agendaId, title, description, sharesSnapshot);
        };

        if (activeSessionIndex.value === -1) {
          const tempSessionId = makeClientId('SESSION');
          const tempSession = { Session_ID: tempSessionId, Agenda_ID: agendaId, Session_Date: sessionDate, Content_JSON: contentStr, _syncing: true };
          applyOptimisticAgenda();
          agendaSessions.value.push(tempSession);
          closeAgendaModal();

          google.script.run
            .withSuccessHandler((res) => {
              agendaSessions.value = agendaSessions.value.filter((s) => !idsMatch(s.Session_ID, tempSessionId));
              const result = parseRunResponse(res);
              if (!result || !result.success) {
                savingSession.value = false;
                rollbackAgenda();
                showToast(result?.error || 'Failed to create session.');
                return;
              }
              agendaSessions.value.push(result.session);
              finalizeAgendaUpdate();
            })
            .withFailureHandler(() => {
              savingSession.value = false;
              agendaSessions.value = agendaSessions.value.filter((s) => !idsMatch(s.Session_ID, tempSessionId));
              rollbackAgenda();
              showToast('Failed to create session.');
            })
            .createAgendaSession(agendaId, sessionDate, contentStr);
        } else {
          const sessionId = activeSession.value?.Session_ID;
          if (!sessionId) { savingSession.value = false; return; }

          const sessionIdx = agendaSessions.value.findIndex((s) => idsMatch(s.Session_ID, sessionId));
          const previousSession = sessionIdx >= 0 ? { ...agendaSessions.value[sessionIdx] } : null;
          const optimisticSession = { ...(previousSession || {}), Session_ID: sessionId, Session_Date: sessionDate, Content_JSON: contentStr, _syncing: true };

          applyOptimisticAgenda();
          if (sessionIdx >= 0) agendaSessions.value.splice(sessionIdx, 1, optimisticSession);
          closeAgendaModal();

          google.script.run
            .withSuccessHandler((res) => {
              const result = parseRunResponse(res);
              if (!result || !result.success) {
                savingSession.value = false;
                if (previousSession) {
                  const idx = agendaSessions.value.findIndex((s) => idsMatch(s.Session_ID, sessionId));
                  if (idx >= 0) agendaSessions.value.splice(idx, 1, previousSession);
                }
                rollbackAgenda();
                showToast(result?.error || 'Failed to update session.');
                return;
              }
              const idx = agendaSessions.value.findIndex((s) => idsMatch(s.Session_ID, sessionId));
              if (idx >= 0) agendaSessions.value.splice(idx, 1, result.session);
              finalizeAgendaUpdate();
            })
            .withFailureHandler(() => {
              savingSession.value = false;
              if (previousSession) {
                const idx = agendaSessions.value.findIndex((s) => idsMatch(s.Session_ID, sessionId));
                if (idx >= 0) agendaSessions.value.splice(idx, 1, previousSession);
              }
              rollbackAgenda();
              showToast('Failed to update session.');
            })
            .updateAgendaSession(sessionId, sessionDate, contentStr);
        }

      const deleteActiveSession = () => {
        if (!activeSession.value?.Session_ID) return;
        if (!confirm('Are you sure you want to delete this session?')) return;

        const sessionId = activeSession.value.Session_ID;
        const previousSessions = agendaSessions.value.slice();
        const previousActiveSession = activeSession.value;
        const previousActiveSessionIndex = activeSessionIndex.value;
        const previousHeaders = activeAgenda.value.headers ? JSON.parse(JSON.stringify(activeAgenda.value.headers)) : [];
        const previousAgendaDate = activeAgenda.value.agendaDate;

        agendaSessions.value = agendaSessions.value.filter((s) => !idsMatch(s.Session_ID, sessionId));
        const remaining = getSessionsForAgenda(activeAgenda.value?.Agenda_ID);
        if (remaining.length > 0) {
          const next = remaining[0];
          let headers = [];
          try { headers = JSON.parse(next.Content_JSON || '[]'); } catch (e) { headers = []; }
          activeSession.value = next;
          activeSessionIndex.value = 0;
          activeAgenda.value.headers = headers;
          activeAgenda.value.agendaDate = formatDateForInput(next.Session_Date || '');
        } else {
          activeSession.value = null;
          activeSessionIndex.value = 0;
          activeAgenda.value.headers = [];
          activeAgenda.value.agendaDate = '';
        }

        google.script.run
          .withSuccessHandler((res) => {
            const result = parseRunResponse(res);
            if (!result || !result.success) {
              agendaSessions.value = previousSessions;
              activeSession.value = previousActiveSession;
              activeSessionIndex.value = previousActiveSessionIndex;
              activeAgenda.value.headers = previousHeaders;
              activeAgenda.value.agendaDate = previousAgendaDate;
              showToast(result?.error || 'Failed to delete session — it has been restored.');
            }
          })
          .withFailureHandler(() => {
            agendaSessions.value = previousSessions;
            activeSession.value = previousActiveSession;
            activeSessionIndex.value = previousActiveSessionIndex;
            activeAgenda.value.headers = previousHeaders;
            activeAgenda.value.agendaDate = previousAgendaDate;
            showToast('Failed to delete session — it has been restored.');

          const src = latest ? (latest.Content_JSON || '[]') : '[]';
          const sections = JSON.parse(src);
          const textParts = [];
          for (const section of sections) {
            for (const item of (section.items || [])) {
              if (item.type === 'text' && item.content && item.content.trim()) {
                textParts.push(item.content.trim());
                if (textParts.length >= 3) break;
              }
            }
            if (textParts.length >= 3) break;
          }
          const source = textParts.length > 0
            ? textParts
            : sections.filter(s => s.title).map(s => s.title).slice(0, 3);
          if (!source.length) return '';
          const joined = source.join(' · ');
          return joined.length > 100 ? joined.slice(0, 100) + '…' : joined;
        } catch (e) {
          return '';
        }
